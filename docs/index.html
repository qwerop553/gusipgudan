<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="99단">
<meta name="theme-color" content="#F3F5F4" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0F1417" media="(prefers-color-scheme: dark)">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" href="icon-192.png">
<style>:root{padding-block:env(safe-area-inset-top,0px) env(safe-area-inset-bottom,0px)}</style>
</head>
<body>
<title>99단 연습장</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@500;600&family=IBM+Plex+Sans+KR:wght@400;600;700&display=swap">
<style>
/* Layout: one-screen phone app. Paper ground, teal ink accent, red-pen corrections, graph-paper hand calculation. */
:root {
  --paper: #F3F5F4;
  --surface: #FFFFFF;
  --surface-2: #E8ECEA;
  --ink: #17212B;
  --muted: #5E6B73;
  --line: #DCE2E0;
  --grid: #CFDDE3;
  --accent: #0E6E66;
  --accent-soft: #D7EBE8;
  --on-accent: #FFFFFF;
  --red: #C93C37;
  --red-soft: #F8E1DF;
  --green: #1E8A4C;
  --green-soft: #DDF1E4;
  --amber: #A86400;
  --amber-soft: #F6E8D2;
  --font-body: "IBM Plex Sans KR", -apple-system, "Apple SD Gothic Neo", "Noto Sans KR", system-ui, sans-serif;
  --font-num: "IBM Plex Mono", ui-monospace, "SF Mono", Menlo, monospace;
  --r: 16px;
  --cell: 34px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --paper: #0F1417; --surface: #182025; --surface-2: #222C32; --ink: #E7EDEA; --muted: #93A1A8;
    --line: #2A363E; --grid: #263A44; --accent: #3DB8A9; --accent-soft: #163B37; --on-accent: #06201D;
    --red: #F0716B; --red-soft: #3D1F1E; --green: #4CC37E; --green-soft: #173324; --amber: #F0A93A; --amber-soft: #3A2C14;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --paper: #0F1417; --surface: #182025; --surface-2: #222C32; --ink: #E7EDEA; --muted: #93A1A8;
  --line: #2A363E; --grid: #263A44; --accent: #3DB8A9; --accent-soft: #163B37; --on-accent: #06201D;
  --red: #F0716B; --red-soft: #3D1F1E; --green: #4CC37E; --green-soft: #173324; --amber: #F0A93A; --amber-soft: #3A2C14;
  color-scheme: dark;
}

* { box-sizing: border-box; }
html { height: 100%; }
body {
  height: 100%; margin: 0; background: var(--paper); color: var(--ink);
  font: 400 15px/1.5 var(--font-body); -webkit-font-smoothing: antialiased;
  -webkit-tap-highlight-color: transparent; overscroll-behavior: none;
}
[hidden] { display: none !important; }
button { font: inherit; color: inherit; border: 0; background: none; cursor: pointer; touch-action: manipulation; }
button:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
.num { font-family: var(--font-num); font-variant-numeric: tabular-nums; }

.app { height: 100%; max-width: 520px; margin: 0 auto; display: flex; flex-direction: column; }
.view { flex: 1; min-height: 0; display: flex; flex-direction: column; padding: 12px 16px 16px; }
.scroll { overflow-y: auto; -webkit-overflow-scrolling: touch; }

/* ---------- headers ---------- */
.top { display: flex; align-items: center; gap: 8px; min-height: 44px; }
.top h2 { margin: 0; font-size: 17px; font-weight: 700; flex: 1; text-align: center; }
.top .spacer { width: 44px; }
.icon-btn { width: 44px; height: 44px; display: grid; place-items: center; border-radius: 12px; color: var(--muted); }
.icon-btn:active { background: var(--surface-2); }
.icon-btn svg { width: 22px; height: 22px; }

/* ---------- home ---------- */
.brand { display: flex; align-items: baseline; gap: 10px; padding: 8px 0 18px; }
.brand h1 { margin: 0; font: 600 40px/1 var(--font-num); letter-spacing: -1px; }
.brand p { margin: 0; color: var(--muted); font-size: 14px; }
.label { font-size: 12px; font-weight: 600; letter-spacing: .08em; color: var(--muted); margin: 20px 0 8px; }
.levels { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.level {
  text-align: left; padding: 12px 14px; border-radius: 14px; background: var(--surface);
  border: 1.5px solid var(--line); display: flex; flex-direction: column; gap: 2px;
}
.level b { font-weight: 600; font-size: 15px; }
.level span { font: 500 12px var(--font-num); color: var(--muted); }
.level[aria-pressed="true"] { border-color: var(--accent); background: var(--accent-soft); }
.level[aria-pressed="true"] span { color: var(--accent); }
.custom { margin-top: 8px; background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 6px 14px; }
.crow { display: flex; align-items: center; gap: 8px; min-height: 48px; }
.crow + .crow { border-top: 1px solid var(--line); }
.crow > span:first-child { width: 40px; font-weight: 600; font-size: 14px; }
.stepper { display: flex; align-items: center; gap: 2px; }
.stepper button { width: 34px; height: 34px; border-radius: 10px; background: var(--surface-2); font-size: 18px; font-weight: 600; }
.stepper output { width: 34px; text-align: center; font: 600 16px var(--font-num); }
.crow .tilde { color: var(--muted); flex: 1; text-align: center; }

.modes { display: flex; flex-direction: column; gap: 8px; }
.mode {
  display: flex; align-items: center; gap: 14px; text-align: left; padding: 14px;
  background: var(--surface); border: 1px solid var(--line); border-radius: var(--r);
}
.mode:active { transform: scale(.985); }
.mode:disabled { opacity: .45; cursor: default; transform: none; }
.mode .ico { width: 44px; height: 44px; border-radius: 12px; display: grid; place-items: center; flex: none; }
.mode .ico svg { width: 22px; height: 22px; }
.mode .txt { flex: 1; min-width: 0; display: flex; flex-direction: column; }
.mode .txt b { font-size: 16px; font-weight: 600; }
.mode .txt span { font-size: 13px; color: var(--muted); }
.mode .chev { color: var(--muted); }
.ico.teal { background: var(--accent-soft); color: var(--accent); }
.ico.amber { background: var(--amber-soft); color: var(--amber); }
.ico.red { background: var(--red-soft); color: var(--red); }
.links { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-top: 8px; }
.link { padding: 14px; border-radius: var(--r); background: var(--surface-2); font-weight: 600; display: flex; align-items: center; justify-content: center; gap: 8px; }
.link svg { width: 18px; height: 18px; color: var(--muted); }

/* ---------- quiz ---------- */
.qbar { display: flex; align-items: center; gap: 8px; }
.qprog { flex: 1; display: flex; flex-direction: column; gap: 6px; }
.qmeta { display: flex; align-items: center; gap: 12px; font: 600 14px var(--font-num); }
.qmeta .grow { flex: 1; }
.qmeta .ok { color: var(--green); }
.qmeta .fire { color: var(--amber); }
.qmeta .low { color: var(--red); }
.bar { height: 6px; border-radius: 3px; background: var(--surface-2); overflow: hidden; }
.bar span { display: block; height: 100%; background: var(--accent); border-radius: 3px; transition: width .3s linear; }
.bar.ta span { background: var(--amber); transition: width 1s linear; }
.qbody { flex: 1; min-height: 0; display: flex; flex-direction: column; justify-content: center; align-items: center; gap: 12px; padding: 12px 0; }
.card {
  width: 100%; background: var(--surface); border: 1px solid var(--line); border-radius: 24px;
  padding: 24px 16px; display: flex; flex-direction: column; align-items: center; gap: 4px;
  transition: background-color .15s, border-color .15s; overflow-y: auto; max-height: 100%;
}
.card.correct { background: var(--green-soft); border-color: var(--green); }
.card.wrong { background: var(--red-soft); border-color: var(--red); }
.prob { font: 600 clamp(40px, 13vw, 60px)/1.1 var(--font-num); letter-spacing: -1px; white-space: nowrap; }
.ans { font: 600 clamp(38px, 12vw, 54px)/1.15 var(--font-num); color: var(--accent); min-height: 1.15em; }
.ans.empty { color: var(--muted); opacity: .5; }
.card.correct .ans { color: var(--green); }
.card.wrong .ans { color: var(--red); text-decoration: line-through; text-decoration-thickness: 3px; }
.fb { font-weight: 600; font-size: 17px; min-height: 1.5em; }
.card.correct .fb { color: var(--green); }
.card.wrong .fb { color: var(--red); }
.hint {
  display: inline-flex; align-items: center; gap: 6px; padding: 9px 16px; border-radius: 999px;
  background: var(--amber-soft); color: var(--amber); font-weight: 600; font-size: 14px;
}
.hint svg { width: 16px; height: 16px; }
.shake { animation: shake .4s linear; }
@keyframes shake { 0%,100% { transform: none } 20% { transform: translateX(-9px) } 40% { transform: translateX(8px) } 60% { transform: translateX(-6px) } 80% { transform: translateX(4px) } }
@media (prefers-reduced-motion: reduce) { .shake { animation: none; } .bar span { transition: none; } }

.keypad { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
.key {
  height: clamp(50px, 8.2vh, 64px); border-radius: 14px; background: var(--surface);
  border: 1px solid var(--line); font: 600 26px var(--font-num); display: grid; place-items: center;
  user-select: none; -webkit-user-select: none;
}
.key:active { background: var(--surface-2); transform: scale(.96); }
.key.fn { background: var(--surface-2); border-color: transparent; }
.key.fn svg { width: 24px; height: 24px; }
.key.go { background: var(--accent); color: var(--on-accent); border-color: transparent; }
.key.go:disabled { opacity: .4; }
.big-btn {
  width: 100%; min-height: 56px; border-radius: 16px; background: var(--accent); color: var(--on-accent);
  font-weight: 700; font-size: 17px; display: flex; align-items: center; justify-content: center; gap: 8px;
}
.big-btn.ghost { background: var(--surface-2); color: var(--ink); }

/* ---------- hand calculation on graph paper ---------- */
.hc-wrap { display: flex; flex-direction: column; align-items: center; gap: 14px; width: 100%; }
.hc-title { font: 600 15px var(--font-num); color: var(--muted); }
.hc { display: flex; gap: 10px; align-items: flex-start; }
.hc-grid {
  background-color: var(--surface);
  background-image: linear-gradient(var(--grid) 1px, transparent 1px), linear-gradient(90deg, var(--grid) 1px, transparent 1px);
  background-size: var(--cell) var(--cell);
  border-right: 1px solid var(--grid); border-bottom: 1px solid var(--grid);
}
.hc-row { display: flex; height: var(--cell); }
.hc-row i {
  width: var(--cell); height: var(--cell); display: grid; place-items: center; font-style: normal;
  font: 600 22px var(--font-num);
}
.hc-row i.op { color: var(--muted); }
.hc-row i.dim { color: var(--muted); opacity: .45; }
.hc-row.ruled { box-shadow: inset 0 -2.5px 0 var(--ink); }
.hc-row.res i { color: var(--accent); }
.hc-notes .hc-note { height: var(--cell); display: flex; align-items: center; font: 500 12px var(--font-num); color: var(--muted); white-space: nowrap; }
.tip { display: flex; flex-direction: column; align-items: center; gap: 2px; font: 500 14px var(--font-num); color: var(--muted); text-align: center; }
.tip b { font: 600 12px var(--font-body); color: var(--amber); letter-spacing: .06em; }
.tip span { font-family: var(--font-body); font-variant-numeric: tabular-nums; }

/* ---------- result ---------- */
.res-head { text-align: center; padding: 20px 0 8px; }
.res-head .kicker { font-size: 13px; color: var(--muted); font-weight: 600; letter-spacing: .06em; }
.res-head h2 { margin: 6px 0 0; font-size: 28px; font-weight: 700; text-wrap: balance; }
.badge { display: inline-block; margin-top: 10px; padding: 4px 12px; border-radius: 999px; background: var(--amber-soft); color: var(--amber); font-weight: 700; font-size: 14px; }
.tiles { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-top: 16px; }
.tile { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 14px; display: flex; flex-direction: column; gap: 2px; }
.tile b { font: 600 24px var(--font-num); }
.tile span { font-size: 13px; color: var(--muted); }
.list { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); overflow: hidden; }
.list-head { padding: 12px 14px 4px; display: flex; justify-content: space-between; align-items: baseline; gap: 8px; }
.list-head b { font-weight: 600; }
.list-head span { font-size: 12px; color: var(--muted); }
.row {
  display: flex; align-items: center; gap: 10px; width: 100%; text-align: left; padding: 11px 14px;
  font: 500 17px var(--font-num); border-top: 1px solid var(--line);
}
.list-head + .row { border-top: 0; }
.row .grow { flex: 1; }
.row .sub { font-size: 13px; color: var(--muted); }
.row.weak { color: var(--red); }
.row svg { width: 16px; height: 16px; color: var(--amber); flex: none; }
.row:active { background: var(--surface-2); }
.stack { display: flex; flex-direction: column; gap: 10px; margin-top: 16px; }

/* ---------- table ---------- */
.picker { display: flex; align-items: center; gap: 12px; background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 10px 14px; }
.picker .n { font: 600 28px var(--font-num); min-width: 3.4em; }
.picker input[type=range] { flex: 1; min-width: 0; accent-color: var(--accent); }
.foot { font-size: 12px; color: var(--muted); text-align: center; margin: 10px 0 4px; }

/* ---------- stats ---------- */
.kind { padding: 12px 14px; border-top: 1px solid var(--line); display: flex; flex-direction: column; gap: 6px; }
.list-head + .kind { border-top: 0; }
.kind .line { display: flex; justify-content: space-between; gap: 8px; font-size: 14px; }
.kind .line b { font-weight: 600; }
.kind .line span { color: var(--muted); font: 500 13px var(--font-num); }
.meter { display: flex; align-items: center; gap: 10px; }
.meter .bar { flex: 1; height: 8px; }
.meter .pct { width: 3em; text-align: right; font: 600 14px var(--font-num); }
.danger { color: var(--red); font-weight: 600; padding: 14px; width: 100%; border-radius: var(--r); background: var(--surface); border: 1px solid var(--line); }
.confirm { display: flex; gap: 8px; align-items: center; background: var(--red-soft); border-radius: var(--r); padding: 10px 12px; }
.confirm span { flex: 1; font-weight: 600; color: var(--red); font-size: 14px; }
.confirm button { padding: 8px 14px; border-radius: 10px; font-weight: 600; }
.confirm .yes { background: var(--red); color: var(--surface); }
.confirm .no { background: var(--surface); }

/* ---------- section switch / percent ---------- */
.seg { display: grid; grid-template-columns: repeat(3, 1fr); gap: 4px; padding: 4px; border-radius: 14px; background: var(--surface-2); }
.seg button { padding: 9px 0; border-radius: 10px; font-weight: 600; color: var(--muted); }
.seg button[aria-selected="true"] { background: var(--surface); color: var(--ink); box-shadow: 0 1px 2px rgb(0 0 0 / .08); }
.level.wide { grid-column: 1 / -1; }
.prob.pct { font-size: clamp(34px, 10.5vw, 50px); }
.sub-q { font-size: 15px; font-weight: 600; color: var(--muted); text-align: center; margin-top: 2px; }
.steps { display: grid; grid-template-columns: auto 1fr; gap: 0; width: 100%; max-width: 360px; border-top: 1px solid var(--grid); }
.st { display: contents; }
.st > span { padding: 8px 6px; border-bottom: 1px solid var(--grid); }
.st .k { font: 600 13px var(--font-body); color: var(--muted); white-space: nowrap; padding-right: 14px; }
.st .v { font: 500 16px var(--font-num); word-break: keep-all; overflow-wrap: break-word; }
.st.res .v { color: var(--accent); font-weight: 600; }

/* ---------- choice buttons (compare problems) ---------- */
.choices { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.choice {
  min-height: clamp(96px, 16vh, 140px); border-radius: 16px; background: var(--surface); border: 1.5px solid var(--line);
  font: 700 20px var(--font-body); display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px;
}
.choice small { font: 500 15px var(--font-num); color: var(--muted); }
.choice:active { transform: scale(.97); background: var(--surface-2); }
.choice.right { border-color: var(--green); background: var(--green-soft); color: var(--green); }
.choice.picked { border-color: var(--red); background: var(--red-soft); color: var(--red); }
.choice:disabled { cursor: default; }

/* ---------- sheet ---------- */
.sheet { position: fixed; inset: 0; background: rgb(0 0 0 / .35); display: flex; align-items: flex-end; justify-content: center; z-index: 10; }
.sheet-panel {
  width: 100%; max-width: 520px; background: var(--paper); border-radius: 24px 24px 0 0;
  padding: 20px 16px calc(16px + env(safe-area-inset-bottom, 0px)); display: flex; flex-direction: column; gap: 16px;
  max-height: 90%; overflow-y: auto;
}
.sheet-panel h3 { margin: 0; text-align: center; font: 600 24px var(--font-num); }
</style>

<div class="app">

  <!-- 홈 -->
  <section class="view scroll" id="v-home"></section>

  <!-- 문제 -->
  <section class="view" id="v-quiz" hidden>
    <div class="qbar">
      <button class="icon-btn" data-act="home" aria-label="그만하고 처음으로">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg>
      </button>
      <div class="qprog">
        <div class="qmeta"><span id="q-count"></span><span class="grow"></span><span class="fire" id="q-streak"></span><span class="ok" id="q-correct"></span></div>
        <div class="bar" id="q-barwrap"><span id="q-bar"></span></div>
      </div>
    </div>
    <div class="qbody">
      <div class="card" id="q-card">
        <div class="prob" id="q-prob"></div>
        <div class="sub-q" id="q-sub"></div>
        <div class="ans" id="q-ans"></div>
        <div class="fb" id="q-fb"></div>
        <div class="hc-wrap" id="q-hc" hidden></div>
      </div>
      <button class="hint" id="q-hint" data-act="reveal">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 18h6M10 21h4M12 3a6 6 0 0 0-3.6 10.8c.6.5 1 1.2 1.1 2V16h5v-.2c.1-.8.5-1.5 1.1-2A6 6 0 0 0 12 3z"/></svg>
        풀이 보기
      </button>
    </div>
    <div class="keypad" id="q-keys">
      <button class="key" data-key="1">1</button><button class="key" data-key="2">2</button><button class="key" data-key="3">3</button>
      <button class="key" data-key="4">4</button><button class="key" data-key="5">5</button><button class="key" data-key="6">6</button>
      <button class="key" data-key="7">7</button><button class="key" data-key="8">8</button><button class="key" data-key="9">9</button>
      <button class="key fn" data-key="del" aria-label="지우기">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 5H9l-6 7 6 7h12z"/><path d="M17 9l-6 6M11 9l6 6"/></svg>
      </button>
      <button class="key" data-key="0">0</button>
      <button class="key go" data-key="ok" id="q-ok" aria-label="확인">
        <svg viewBox="0 0 24 24" width="26" height="26" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5l4.5 4.5L19 7"/></svg>
      </button>
    </div>
    <div class="choices" id="q-choices" hidden></div>
    <button class="big-btn" id="q-next" data-act="next" hidden>다음 문제 →</button>
  </section>

  <!-- 결과 / 곱셈표 / 기록 -->
  <section class="view scroll" id="v-result" hidden></section>
  <section class="view scroll" id="v-table" hidden></section>
  <section class="view scroll" id="v-stats" hidden></section>
</div>

<div class="sheet" id="sheet" hidden data-act="close-sheet">
  <div class="sheet-panel" id="sheet-panel"></div>
</div>

<script>
(() => {
  // ==== ENGINE START ====
  // 문제 엔진: 화면·저장소를 건드리지 않는 순수 함수들. web/test/engine.test.js 가 이 구간만 잘라서 검사한다.

  // ---------- 공통 도구 ----------
  const rnd = (lo, hi) => lo + Math.floor(Math.random() * (hi - lo + 1));
  const pick = arr => arr[rnd(0, arr.length - 1)];
  const coin = (p = 0.5) => Math.random() < p;
  const inR = (v, r) => v >= r[0] && v <= r[1];
  const gcd = (x, y) => y ? gcd(y, x % y) : x;
  const fmt = x => String(+x.toFixed(2));
  const sg = x => x < 0 ? '−' : '+';
  const signed = x => `${sg(x)}${Math.abs(x)}%`;
  const tip = (title, ...lines) => ({ title, lines });

  // 숫자 뒤 조사. 끝자리를 소리 내 읽어 받침이 있는지 본다 (이·사·오·구만 받침 없음; 0은 십·백·천·영 모두 받침)
  const batchim = n => !'2459'.includes(fmt(n).slice(-1));
  const eun = n => batchim(n) ? '은' : '는';
  const ga = n => batchim(n) ? '이' : '가';
  const eul = n => batchim(n) ? '을' : '를';
  const wa = n => batchim(n) ? '과' : '와';

  // ---------- 유형 등록부 ----------
  // TYPES[t] = {
  //   section: 'mult' | 'div' | 'pct',  title, ex(홈 버튼 예시),
  //   fields: id에 저장할 숫자 필드 이름 (기본 ['A','B','dir']),
  //   gen() → 문제 p ({ t, ...fields }),  answer(p) → 1~99999 정수,
  //   unit?: '%' 또는 (p) => 단위,  answerText?(p), heading?(p) (풀이 제목, 기본 "label → 정답"),
  //   prompt(p) → { main(큰 줄), sub(설명) },  label(p) → 목록에 쓰는 한 줄,
  //   hint(p) → { grid?, steps?: [[머리, 내용], ...] (마지막 줄 = 결론), tips?: [{ title, lines }] },
  //   finalToken?(p) → 마지막 풀이 줄에 꼭 들어갈 글자 (기본: 정답 숫자),
  //   choices?(p) → ['앞', '뒤'] 처럼 고르는 문제의 버튼 (정답은 1부터 센 번호),
  //   accept?(p, v) → 어림 문제처럼 정답 범위가 있을 때,
  // }
  const TYPES = {};
  const fieldsOf = t => (TYPES[t] && TYPES[t].fields) || ['A', 'B', 'dir'];
  const typeList = section => Object.keys(TYPES).filter(t => t !== 'm' && TYPES[t].section === section);

  // 곱셈은 "47x38", 나머지는 "of:340:15:1" 처럼 저장
  const pid = p => p.t === 'm' ? `${p.a}x${p.b}` : [p.t, ...fieldsOf(p.t).map(f => p[f])].join(':');
  function parse(id) {
    if (!id.includes(':')) { const [a, b] = id.split('x').map(Number); return { t: 'm', a, b }; }
    const [t, ...nums] = id.split(':');
    const p = { t };
    fieldsOf(t).forEach((f, i) => { p[f] = Number(nums[i]); });
    return p;
  }
  const knownId = id => !!TYPES[id.includes(':') ? id.split(':')[0] : 'm'];

  const answer = p => TYPES[p.t].answer(p);
  const unit = p => { const u = TYPES[p.t].unit; return typeof u === 'function' ? u(p) : (u || ''); };
  const answerText = p => TYPES[p.t].answerText ? TYPES[p.t].answerText(p) : `${answer(p)}${unit(p)}`;
  const prompt = p => TYPES[p.t].prompt(p);
  const label = p => TYPES[p.t].label(p);
  const hint = p => TYPES[p.t].hint(p);
  const sectionOf = p => TYPES[p.t].section;
  const choices = p => TYPES[p.t].choices ? TYPES[p.t].choices(p) : null;
  const accepts = (p, v) => TYPES[p.t].accept ? TYPES[p.t].accept(p, v) : v === answer(p);
  const calcTitle = p => TYPES[p.t].heading ? TYPES[p.t].heading(p) : `${label(p)} → ${answerText(p)}`;
  const finalToken = p => TYPES[p.t].finalToken ? TYPES[p.t].finalToken(p) : String(answer(p));
  const genType = t => TYPES[t].gen();
  const genSection = (section, type) => genType(type === 'mix' ? pick(typeList(section)) : type);

  // ---------- 곱셈 ----------
  // 세로셈 줄들: 위 수 × 아래 수, 부분곱(자리 올림만큼 오른쪽을 비움), 합
  function multGrid(a, b) {
    const top = Math.max(a, b), bot = Math.min(a, b);
    const parts = String(bot).split('').reverse().map(Number).map((d, i) => ({ d, i })).filter(x => x.d);
    const rows = [{ pre: '', s: String(top), sh: 0 }, { pre: '×', s: String(bot), sh: 0, ruled: true }];
    if (parts.length <= 1) {
      rows.push({ pre: '', s: String(top * bot), sh: 0, res: true });
    } else {
      parts.forEach((x, k) => rows.push({ pre: '', s: String(top * x.d), sh: x.i, note: `${top}×${x.d * 10 ** x.i}`, ruled: k === parts.length - 1 }));
      rows.push({ pre: '', s: String(top * bot), sh: 0, res: true });
    }
    const width = Math.max(...rows.map(r => r.s.length + r.sh));
    return { rows, width };
  }

  // 암산 팁: 앞쪽일수록 더 쓸모 있는 요령 (아래 곱셈 확장에서 더 많은 요령으로 바꿔 끼운다)
  let multTips = function (a, b) {
    const top = Math.max(a, b), bot = Math.min(a, b), tips = [];
    const parts = String(bot).split('').reverse().map(Number).map((d, i) => ({ d, i })).filter(x => x.d);
    if (parts.length > 1) {
      const terms = parts.slice().reverse().map(x => [x.d * 10 ** x.i, top * x.d * 10 ** x.i]);
      tips.push(tip('암산 팁', `${top}×${terms.map(t => t[0]).join(` + ${top}×`)}`, `= ${terms.map(t => t[1]).join(' + ')} = ${top * bot}`));
    } else if (top >= 10 && bot > 1 && top % 10) {
      const t = Math.floor(top / 10) * 10, o = top % 10;
      tips.push(tip('암산 팁', `${t}×${bot} + ${o}×${bot}`, `= ${t * bot} + ${o * bot} = ${top * bot}`));
    }
    return tips;
  };
  const multSplitTips = multTips;   // 기본 "쪼개서 곱하기" 팁 (확장이 재사용)

  TYPES.m = {
    section: 'mult', title: '곱셈',
    gen: () => ({ t: 'm', a: rnd(11, 99), b: rnd(11, 99) }),
    answer: p => p.a * p.b,
    prompt: p => ({ main: `${p.a} × ${p.b}`, sub: '' }),
    label: p => `${p.a} × ${p.b}`,
    heading: p => `${p.a} × ${p.b} = ${p.a * p.b}`,
    hint: p => ({ grid: multGrid(p.a, p.b), tips: multTips(p.a, p.b) }),
  };

  // ---------- 퍼센트 ----------
  const FRACTIONS = { 5: '1/20', 10: '1/10', 20: '1/5', 25: '1/4', 40: '2/5', 50: '1/2', 60: '3/5', 75: '3/4', 80: '4/5' };

  // A가 m의 배수면 A×B/100 이 정수. A는 두 자리~네 자리까지 고루.
  function pickA(m) {
    const r = Math.random();
    const [lo, hi] = r < 0.15 ? [20, 99] : r < 0.65 ? [100, 999] : [1000, 9990];
    const kLo = Math.ceil(lo / m), kHi = Math.floor(hi / m);
    return kLo <= kHi ? m * rnd(kLo, kHi) : m * rnd(Math.ceil(100 / m), Math.floor(9990 / m));
  }
  // B는 5의 배수 반·아무 수 반. signed면 40% 확률로 감소(dir = −1, B ≤ 60)
  function pctAB(signedDir = false) {
    const dir = signedDir && coin(0.4) ? -1 : 1;
    const maxB = dir < 0 ? 60 : 95;
    const B = coin() ? 5 * rnd(1, maxB / 5) : rnd(1, maxB);
    return { A: pickA(100 / gcd(B, 100)), B, dir };
  }
  const delta = p => p.A * p.B / 100;
  const up = p => p.dir > 0 ? '증가' : '감소';

  // base의 B% 를 10%, 1% 덩어리로 세는 줄들
  function chunkLines(base, B) {
    const ten = base / 10, one = base / 100, t = Math.floor(B / 10), o = B % 10;
    const terms = [], values = [];
    if (t) { terms.push(t === 1 ? fmt(ten) : `${fmt(ten)}×${t}`); values.push(ten * t); }
    if (o) { terms.push(o === 1 ? fmt(one) : `${fmt(one)}×${o}`); values.push(one * o); }
    const sum = values.length > 1 ? `${values.map(fmt).join(' + ')} = ` : '';
    return [
      ['10%', `${base} ÷ 10 = ${fmt(ten)}`],
      ['1%', `${base} ÷ 100 = ${fmt(one)}`],
      [`${B}%`, `${terms.join(' + ')} = ${sum}${fmt(base * B / 100)}`],
    ];
  }
  const chunkTerms = (base, B) => chunkLines(base, B)[2][1].split(' = ')[0];

  // "A의 B% = B의 A%" 뒤집기 팁 (뒤집는 게 더 쉬울 때만). 아래 퍼센트 확장에서 채운다.
  let swapTip = (A, B) => null;

  TYPES.of = {
    section: 'pct', title: 'A의 B%', ex: '340의 15% = 51',
    gen: () => ({ t: 'of', ...pctAB() }),
    answer: delta,
    prompt: p => ({ main: `${p.A} × ${p.B}%`, sub: `${p.A}의 ${p.B}%는?` }),
    label: p => `${p.A}의 ${p.B}%`,
    hint: p => {
      const tips = [], frac = FRACTIONS[p.B], s = swapTip(p.A, p.B);
      if (s) tips.push(s);
      if (frac) tips.push(tip('분수 팁', `${p.B}% = ${frac} → ${p.A} × ${frac} = ${fmt(delta(p))}`));
      return { steps: chunkLines(p.A, p.B), tips };
    },
  };

  TYPES.ratio = {
    section: 'pct', title: '몇 %인가', ex: '51은 340의 15%', unit: '%',
    gen: () => ({ t: 'ratio', ...pctAB() }),
    answer: p => p.B,
    prompt: p => ({ main: `${delta(p)} ÷ ${p.A}`, sub: `${delta(p)}${eun(delta(p))} ${p.A}의 몇 %?` }),
    label: p => `${delta(p)}${eun(delta(p))} ${p.A}의 몇 %`,
    hint: p => {
      const d = delta(p), frac = FRACTIONS[p.B];
      return {
        steps: [['식', `${fmt(d)} ÷ ${p.A} × 100`], ...chunkLines(p.A, p.B).slice(0, 2), ['세기', `${fmt(d)} = ${chunkTerms(p.A, p.B)} → ${p.B}%`]],
        tips: frac ? [tip('분수 팁', `${fmt(d)} ÷ ${p.A} = ${frac} = ${p.B}%`)] : [],
      };
    },
  };

  TYPES.change = {
    section: 'pct', title: '증감률', ex: '250 → 290 = 16%↑', unit: '%',
    gen: () => ({ t: 'change', ...pctAB(true) }),
    answer: p => p.B,
    prompt: p => ({ main: `${p.A} → ${p.A + p.dir * delta(p)}`, sub: `${up(p)}율은 몇 %?` }),
    label: p => `${p.A} → ${p.A + p.dir * delta(p)} ${up(p)}율`,
    hint: p => {
      const d = delta(p), after = p.A + p.dir * d;
      return {
        steps: [['차이', `${p.dir > 0 ? `${after} − ${p.A}` : `${p.A} − ${after}`} = ${fmt(d)}`],
                ['식', `${fmt(d)} ÷ ${p.A} (처음 값) × 100`], ...chunkLines(p.A, p.B).slice(0, 2),
                ['세기', `${fmt(d)} = ${chunkTerms(p.A, p.B)} → ${p.B}% ${up(p)}`]],
        tips: [tip('주의', '증감률은 항상 처음 값(기준)으로 나눠요')],
      };
    },
  };

  TYPES.after = {
    section: 'pct', title: '증감 후 값', ex: '480에서 25%↑ = 600',
    gen: () => ({ t: 'after', ...pctAB(true) }),
    answer: p => p.A + p.dir * delta(p),
    prompt: p => ({ main: `${p.A} ${sg(p.dir)}${p.B}%`, sub: `${p.A}에서 ${p.B}% ${up(p)}하면?` }),
    label: p => `${p.A}에서 ${p.B}% ${up(p)}`,
    hint: p => ({
      steps: [...chunkLines(p.A, p.B), [up(p), `${p.A} ${sg(p.dir)} ${fmt(delta(p))} = ${fmt(answer(p))}`]],
      tips: [tip('한 번에', `${p.A} × ${fmt(1 + p.dir * p.B / 100)} = ${fmt(answer(p))}`)],
    }),
  };

  TYPES.base = {
    section: 'pct', title: '역산', ex: '15%가 51 → 340',
    gen: () => ({ t: 'base', ...pctAB() }),
    answer: p => p.A,
    prompt: p => ({ main: `? × ${p.B}% = ${delta(p)}`, sub: `${p.B}%가 ${delta(p)}인 수는?` }),
    label: p => `${p.B}%가 ${delta(p)}인 수`,
    hint: p => {
      const d = delta(p), one = d / p.B, frac = FRACTIONS[p.B];
      const steps = [['식', `${fmt(d)} ÷ ${p.B}% = ${fmt(d)} ÷ ${p.B} × 100`], ['1%', `${fmt(d)} ÷ ${p.B} = ${fmt(one)}`], ['100%', `${fmt(one)} × 100 = ${p.A}`]];
      if (p.B % 10 === 0) steps.splice(1, 0, ['10%', `${fmt(d)} ÷ ${p.B / 10} = ${fmt(d / (p.B / 10))}`]);
      return { steps, tips: frac ? [tip('분수 팁', `${p.B}% = ${frac} → ${fmt(d)} ÷ (${frac}) = ${p.A}`)] : [] };
    },
  };

  TYPES.twice = {
    section: 'pct', title: '연속 증감', ex: '+20% → −10% = 108',
    gen() {
      // 10의 배수끼리면 (100+a)(100+b)/100 이 정수. b가 5의 홀수배면 a는 20의 배수
      for (;;) {
        const a = 10 * rnd(1, 5) * (coin() ? 1 : -1);
        const b = 5 * rnd(1, 10) * (coin() ? 1 : -1);
        const a2 = Math.abs(b) % 10 ? 20 * rnd(1, 2) * Math.sign(a) : a;
        if ((100 + a2) * (100 + b) !== 10000) return { t: 'twice', A: a2, B: b, dir: 1 };
      }
    },
    answer: p => (100 + p.A) * (100 + p.B) / 100,
    prompt: p => ({ main: `${signed(p.A)} → ${signed(p.B)}`, sub: '처음을 100이라 하면 결과는?' }),
    label: p => `100 → ${signed(p.A)} → ${signed(p.B)}`,
    hint: p => {
      const mid = 100 + p.A, ans = answer(p), step2 = mid * Math.abs(p.B) / 100;
      const pr = x => x < 0 ? `(−${fmt(-x)})` : fmt(x);
      return {
        steps: [['처음', '100'],
                ['1단계', `100 ${sg(p.A)} ${Math.abs(p.A)} = ${mid}`],
                ['2단계', `${mid}의 ${Math.abs(p.B)}% = ${fmt(step2)}`],
                ['', `${mid} ${sg(p.B)} ${fmt(step2)} = ${fmt(ans)}`],
                ['결과', `${fmt(ans)} → 처음보다 ${fmt(Math.abs(ans - 100))}% ${ans >= 100 ? '증가' : '감소'}`]],
        tips: [tip('주의', `그냥 더하면 안 돼요: ${pr(p.A)} + ${pr(p.B)} + ${pr(p.A)}×${pr(p.B)}÷100 = ${ans < 100 ? '−' : '+'}${fmt(Math.abs(ans - 100))}%`)],
      };
    },
  };

  // ---------- 확장 유형 (여기 아래에 추가) ----------
  // ===== 곱셈 암산 요령 =====
    // ---------- 곱셈 암산 요령 (multTips 확장) ----------
    // 문제에 정말 들어맞는 요령만 골라 쉬운 것부터 최대 2개. 팁의 모든 식은 그대로 계산해도 참이다.
    const mt_W = 34;                                                     // 팁 한 줄 최대 글자 수
    const mt_ZERO = ['', '0을', '0을 두 개', '0을 세 개'];
    const mt_zeros = n => { let z = 0; while (n && n % 10 === 0) { n /= 10; z++; } return z; };   // 끝의 0 개수
    const mt_core = n => n / 10 ** mt_zeros(n);                          // 끝의 0을 뗀 수
    const mt_nz = n => String(n).replace(/0/g, '').length;               // 0이 아닌 숫자 개수 (곱할 덩어리 수)
    const mt_places = n => String(n).split('').map((d, i, s) => Number(d) * 10 ** (s.length - 1 - i)).filter(v => v);
    const mt_other = (a, b, k) => a === k ? b : b === k ? a : 0;
    const mt_digit0 = n => n % 10 === 0 && mt_core(n) < 10;               // 20, 70, 300 처럼 한 자리 수 뒤에 0만 붙은 수
    // "x = y = z" 사슬 / "x → y" 를 한 줄에, 길면 두 줄로
    const mt_chain = (...xs) => { const s = xs.join(' = '); return s.length <= mt_W ? [s] : [xs[0], `= ${xs.slice(1).join(' = ')}`]; };
    const mt_then = (x, y) => { const s = `${x} → ${y}`; return s.length <= mt_W ? [s] : [x, `→ ${y}`]; };

    // 0을 뗀 작은 곱 한 줄: 한쪽을 자리별로 쪼개 곱한다 (4×38 = 120 + 32 = 152, 47×38 = 1410 + 376 = 1786)
    // ×2, 100 이하(25×3), 한 자리 곱으로 딱 떨어지는 백(75×4)은 바로 아는 값이라 쪼개지 않는다
    function mt_coreLine(x, y) {
      const big = Math.max(x, y), small = Math.min(x, y), [cut, by] = small < 10 ? [big, small] : [small, big];
      const pl = mt_places(cut), easy = big < 10 || small === 2 || x * y <= 100 || (small < 10 && x * y % 100 === 0);
      return pl.length < 2 || easy ? `${x}×${y} = ${x * y}` : `${x}×${y} = ${pl.map(v => v * by).join(' + ')} = ${x * y}`;
    }

    // 0 떼기: 40×38 → 4×38 = 152, 0을 붙여 1520
    function mt_zero(a, b) {
      const za = mt_zeros(a), zb = mt_zeros(b);
      if (!za && !zb) return null;
      const ca = mt_core(a), cb = mt_core(b), back = `${ca * cb} 뒤에 ${mt_ZERO[za + zb]} 붙여 ${a * b}`;
      return ca === 1 || cb === 1 ? tip('0 떼기', back) : tip('0 떼기', mt_coreLine(ca, cb), back);
    }

    // 19단: 13×17 = (13 + 7)×10 + 3×7
    function mt_teens(a, b) {
      if (!inR(a, [11, 19]) || !inR(b, [11, 19])) return null;
      const ua = a - 10, ub = b - 10;
      return tip('19단 요령', `${a}×${b} = (${a} + ${ub})×10 + ${ua}×${ub}`, `= ${(a + ub) * 10} + ${ua * ub} = ${a * b}`);
    }

    // 제곱: 끝이 5면 앞자리×(앞자리 + 1) 뒤에 25 / 아니면 10의 배수로 올리고 내려 곱한 뒤 d² 더하기
    function mt_square(n) {
      const t = Math.floor(n / 10), u = n % 10;
      if (u === 5) return tip('제곱 요령', '끝이 5면 앞자리×(앞자리 + 1) 뒤에 25를 붙여요', `${t}×(${t} + 1) = ${t * (t + 1)}`, `앞 ${t * (t + 1)}, 뒤 25를 붙여 ${n * n}`);
      const hi = u > 5, d = hi ? 10 - u : u, r = hi ? n + d : n - d, o = hi ? n - d : n + d;
      return tip('제곱 요령', '같은 만큼 내리고 올려 곱한 뒤 차의 제곱을 더해요',
                 `${n} ${hi ? '+' : '−'} ${d} = ${r}, ${n} ${hi ? '−' : '+'} ${d} = ${o}`,
                 `${n}² = ${r}×${o} + ${d}²`, `= ${r * o} + ${d * d} = ${n * n}`);
    }
    // 제곱 전개: 47² = (50 − 3)² = 2500 − 300 + 9
    function mt_expand(n) {
      const u = n % 10, hi = u > 5, d = hi ? 10 - u : u, r = hi ? n + d : n - d, s = hi ? '−' : '+';
      return tip('제곱 전개', `${n}² = (${r} ${s} ${d})²`, `= ${r * r} ${s} ${2 * r * d} + ${d * d} = ${n * n}`);
    }
    function mt_squareTips(n) {
      if (n % 10 === 0) return [mt_zero(n, n)];
      if (n < 20) return n % 10 >= 5 ? [mt_teens(n, n), mt_square(n)] : [mt_teens(n, n)];
      return [mt_square(n), mt_expand(n)];
    }

    // ×11: 두 숫자 사이에 합 끼우기 (78×11: 7 + 8 = 15 → 858). 30×11 처럼 0으로 끝나면 0 떼기가 낫다
    function mt_x11(a, b) {
      const x = mt_other(a, b, 11);
      if (!x || x % 10 === 0) return null;
      if (x < 10 || x > 99) return tip('×11 요령', ...mt_chain(`${x}×11`, `${x * 10} + ${x}`, `${x * 11}`));
      const p = Math.floor(x / 10), q = x % 10, s = p + q;
      return tip('×11 요령', '두 숫자 사이에 그 합을 끼워요', ...(s < 10
        ? [`${p} + ${q} = ${s}`, `앞 ${p}, 가운데 ${s}, 끝 ${q} → ${x * 11}`]
        : [`${p} + ${q} = ${s} → 1은 앞자리로 올려요`, `앞 ${p + 1}, 가운데 ${s - 10}, 끝 ${q} → ${x * 11}`]));
    }

    // 십의 자리가 같고 일의 자리 합이 10: 43×47 → 4×5 = 20, 3×7 = 21 → 2021
    function mt_tenPair(a, b) {
      const t = Math.floor(a / 10), ua = a % 10, ub = b % 10;
      if (a === b || !inR(a, [11, 99]) || !inR(b, [11, 99]) || Math.floor(b / 10) !== t || ua + ub !== 10) return null;
      const f = t * (t + 1), e = ua * ub;
      return tip('끝자리 합 10', '십의 자리가 같고 일의 자리 합이 10이면', `${t}×(${t} + 1) = ${f}, ${ua}×${ub} = ${e}`,
                 `앞 ${f}, 뒤 ${String(e).padStart(2, '0')}${eul(e)} 붙여 ${a * b}`);
    }

    // 둘 다 100 근처: 97×96 = (97 − 4)×100 + 3×4
    function mt_near100(a, b) {
      if (a === b || !inR(a, [91, 99]) || !inR(b, [91, 99])) return null;
      const x = 100 - a, y = 100 - b;
      return tip('100 근처', '모자란 수를 엇갈려 빼고 ×100, 둘의 곱을 더해요', `${a} = 100 − ${x}, ${b} = 100 − ${y}`, `${a}×${b} = (${a} − ${y})×100 + ${x}×${y}`, `= ${(a - y) * 100} + ${x * y} = ${a * b}`);
    }

    // 합차 공식: 가운데가 10의 배수일 때 47×53 = 50² − 3²
    function mt_diffSq(a, b) {
      const m = (a + b) / 2, d = Math.abs(a - b) / 2;
      if (a === b || m % 10 || m < 20 || d > 9) return null;
      const s = x => x < m ? '−' : '+';
      return tip('합차 공식', `${a}×${b} = (${m} ${s(a)} ${d})×(${m} ${s(b)} ${d})`, `= ${m}² − ${d}² = ${m * m} − ${d * d} = ${a * b}`);
    }

    // 특별한 수: ×99, ×25, ×75, ×50, ×15, ×5, ×9
    // 상대가 30·70 같은 수면 0을 떼고 한 자리 곱(25×3 = 75)만 하면 되므로 요령을 쓰지 않는다
    function mt_x99(a, b) {
      const x = mt_other(a, b, 99);
      return x ? tip('×99 요령', '×99는 ×100 한 뒤 그 수를 한 번 빼요', ...mt_chain(`${x}×100 − ${x}`, `${x * 100} − ${x}`, `${x * 99}`)) : null;
    }
    function mt_x25(a, b) {
      const x = mt_other(a, b, 25);
      if (x < 5 || (x % 10 === 0 && x % 4)) return null;   // 20·40처럼 4로 나눠지면 ÷4가 깔끔하다
      return x % 4 === 0
        ? tip('×25 요령', '×25는 ÷4 한 뒤 ×100 해요', ...mt_then(`${x} ÷ 4 = ${x / 4}`, `${x / 4}×100 = ${x * 25}`))
        : tip('×25 요령', '×25는 ×100 한 뒤 ÷4 해요', ...mt_then(`${x}×100 = ${x * 100}`, `${x * 100} ÷ 4 = ${x * 25}`));
    }
    function mt_x75(a, b) {
      const x = mt_other(a, b, 75);
      if (x < 5 || (x < 10 && x % 4) || (x % 10 === 0 && x % 4)) return null;   // 75×7은 쪼개기, 75×5·75×9는 ×5·×9가 쉽다
      if (x % 4 && mt_round(a, b)) return null;   // 38×75 는 40×75 − 2×75 가 ÷4·×3 두 번보다 쉽다
      return x % 4 === 0
        ? tip('×75 요령', '×75는 ÷4 한 뒤 ×300 해요', ...mt_then(`${x} ÷ 4 = ${x / 4}`, `${x / 4}×300 = ${x * 75}`))
        : tip('×75 요령', '×75는 ×100, ÷4 한 뒤 ×3 해요', `${x}×100 ÷ 4 = ${x * 25}`, `${x * 25}×3 = ${x * 75}`);
    }
    function mt_x50(a, b) {
      const x = mt_other(a, b, 50);
      if (x < 10 || mt_digit0(x)) return null;   // 50×7, 50×30 은 0 떼기(5×3)가 더 쉽다
      return x % 2 === 0
        ? tip('×50 요령', '×50은 반으로 나눈 뒤 ×100 해요', ...mt_then(`${x} ÷ 2 = ${x / 2}`, `${x / 2}×100 = ${x * 50}`))
        : tip('×50 요령', '×50은 ×100 한 뒤 반으로 나눠요', ...mt_then(`${x}×100 = ${x * 100}`, `${x * 100} ÷ 2 = ${x * 50}`));
    }
    function mt_x15(a, b) {
      const x = mt_other(a, b, 15);
      if (x < 3 || x % 10 === 0) return null;
      return tip('×15 요령', '×15는 ×10에 그 반을 더해요', `${x}×10 = ${x * 10}, ${x * 10} ÷ 2 = ${x * 5}`, `${x * 10} + ${x * 5} = ${x * 15}`);
    }
    function mt_x5(a, b) {
      const x = mt_other(a, b, 5);
      if (x < 10 || x % 10 === 0) return null;   // 40×5 는 0 떼기
      return x % 2 === 0
        ? tip('×5 요령', '×5는 반으로 나눈 뒤 ×10 해요', ...mt_then(`${x} ÷ 2 = ${x / 2}`, `${x / 2}×10 = ${x * 5}`))
        : tip('×5 요령', '×5는 ×10 한 뒤 반으로 나눠요', ...mt_then(`${x}×10 = ${x * 10}`, `${x * 10} ÷ 2 = ${x * 5}`));
    }
    function mt_x9(a, b) {
      const x = mt_other(a, b, 9);
      return x >= 10 && x % 10 ? tip('×9 요령', '×9는 ×10 한 뒤 그 수를 한 번 빼요', ...mt_chain(`${x}×10 − ${x}`, `${x * 10} − ${x}`, `${x * 9}`)) : null;
    }

    // 반·두 배: 짝수 × 5로 끝나는 수 → 16×45 = 8×90 (곱할 덩어리가 줄어들 때만)
    function mt_halve(a, b) {
      const xFirst = a % 2 === 0 && b % 10 === 5;
      if (!xFirst && !(b % 2 === 0 && a % 10 === 5)) return null;
      let x = xFirst ? a : b, k = xFirst ? b : a;
      if (x === 2 || k === 5 || k === 25 || k === 75) return null;   // ×2는 그냥 두 배, 나머지는 전용 요령
      const terms = [];
      while (x % 2 === 0 && mt_zeros(k * 2) > mt_zeros(k)) {
        const nx = x / 2, nk = k * 2, term = nx === 1 ? `${nk}` : xFirst ? `${nx}×${nk}` : `${nk}×${nx}`;
        const tail = nx === 1 ? [...terms, term] : [...terms, term, `${a * b}`];
        if (`= ${tail.join(' = ')}`.length > mt_W) break;   // 두 줄 안에 들어갈 만큼만
        x = nx; k = nk; terms.push(term);
      }
      if (!terms.length) return null;
      const work = mt_nz(mt_core(k)) * mt_nz(x);
      if (work > 2 || work >= mt_nz(a) * mt_nz(b)) return null;
      if (x !== 1) terms.push(`${a * b}`);
      return tip('반·두 배', '한쪽은 반으로, 다른 쪽은 두 배로', ...mt_chain(`${a}×${b}`, ...terms));
    }

    // 암산 수고 어림: n에 한 자리 수 m을 곱하는 수고 (×0·×1 공짜, 구구단·두 배 쉬움, ×5는 ×10의 반)
    const mt_mulCost = (n, m) => m <= 1 ? 0 : n < 10 || m === 2 ? 0.5 : m === 5 ? 0.7 : mt_nz(n) * 0.5;
    // 기본 쪼개기(아래 수를 자리별로, 아래가 한 자리면 위 수를 자리별로)의 수고
    function mt_splitCost(a, b) {
      const top = Math.max(a, b), bot = Math.min(a, b);
      const [n, ds] = bot >= 10 ? [top, String(bot)] : [null, String(top)];
      const parts = ds.split('').map(Number).filter(d => d);
      return parts.reduce((s, d) => s + (n ? mt_mulCost(n, d) : mt_mulCost(d, bot)), 0) + 0.3 * (parts.length - 1);
    }

    // 반올림: 10·100의 배수에 가까운 수를 딱 떨어지게 바꾸고 차이만큼 빼거나 더한다 (49×38 = 50×38 − 38)
    // 기본 쪼개기보다 실제로 덜 수고로울 때만 쓴다 (68×31 은 68×30 + 68 이 더 쉽다)
    function mt_round(a, b) {
      const cands = [];
      for (const [k, y] of [[a, b], [b, a]]) {
        const u = k % 10;
        if (k < 10 || k === 99) continue;                                         // 99는 ×99 요령
        if (k < 100) {
          if (u >= 8) cands.push({ k, y, r: k + 10 - u });                        // 38 → 40, 98 → 100
          else if (k >= 95) cands.push({ k, y, r: 100 });                         // 95~97 → 100
          else if ((u === 1 || u === 2) && k > y && y >= 10) cands.push({ k, y, r: k - u });   // 큰 쪽 72 → 70
        } else if (k % 100 >= 91) cands.push({ k, y, r: k - k % 100 + 100 });     // 398 → 400
      }
      const cost = c => mt_mulCost(c.y, mt_core(c.r)) + mt_mulCost(c.y, Math.abs(c.r - c.k)) + (c.r > c.k ? 0.4 : 0.3);
      const best = cands.sort((p, q) => cost(p) - cost(q))[0];
      if (!best || cost(best) >= mt_splitCost(a, b)) return null;
      const { k, y, r } = best, d = Math.abs(r - k), s = r > k ? '−' : '+';
      return tip('반올림 요령', `${k} = ${r} ${s} ${d}`, `${a}×${b} = ${r}×${y} ${s} ${d === 1 ? y : `${d}×${y}`}`, `= ${r * y} ${s} ${d * y} = ${a * b}`);
    }

    // 세 자리 × 한 자리: 백·십·일 자리로 쪼개 더하기 (347×6 = 1800 + 240 + 42)
    function mt_places3(a, b) {
      const x = Math.max(a, b), y = Math.min(a, b), pl = mt_places(x);
      if (x < 100 || y > 9 || x % 10 === 0) return null;
      return tip('암산 팁', pl.map(v => `${v}×${y}`).join(' + '), `= ${pl.map(v => v * y).join(' + ')} = ${x * y}`);
    }

    // 앞에 있을수록 먼저 보여 줄 요령
    const mt_ORDER = [mt_teens, mt_x11, mt_tenPair, mt_near100, mt_diffSq, mt_x99, mt_x25, mt_x75, mt_x50, mt_x15, mt_zero, mt_x5,
      (a, b) => Math.max(a, b) < 100 ? mt_x9(a, b) : null, mt_halve, mt_round, mt_places3,
      (a, b) => Math.max(a, b) >= 100 ? mt_x9(a, b) : null];
    // 요령이 하나뿐이면 기본 "쪼개서 곱하기"를 덧붙인다. 그 요령이 이미 쪼개는 방식이면 생략
    // (×11은 두 자리 수에 끼우기를 쓸 때만 "×10 + 한 번" 쪼개기가 다른 방법이 된다)
    const mt_splitAdds = (t, a, b) => !['19단 요령', '0 떼기', '암산 팁', '×15 요령'].includes(t.title)
      && !(t.title === '×11 요령' && !inR(mt_other(a, b, 11), [10, 99]));

    multTips = function (a, b) {
      if (a < 10 && b < 10) return [];                    // 구구단
      if (a === 1 || b === 1) return [];                  // ×1은 그 수 그대로 (곱셈표 1행)
      if (mt_core(a) === 1 || mt_core(b) === 1) return [mt_zero(a, b)];   // ×10·×100은 0만 붙이면 된다
      if (a === b) return mt_squareTips(a);
      const tips = [];
      for (const f of mt_ORDER) {
        const t = f(a, b);
        if (t) tips.push(t);
        if (tips.length === 2) return tips;
      }
      if (!tips.length || mt_splitAdds(tips[0], a, b)) tips.push(...multSplitTips(a, b));
      return tips.slice(0, 2);
    };

  // ===== 퍼센트: 뒤집기 · 분수 → % =====
    // ---------- 퍼센트 확장: 뒤집기 (A의 B% = B의 A%) ----------
    // A의 B% = A × B ÷ 100 = B의 A%. 쉬운 쪽(50·25·20·150 …)을 %로 두면 암산이 끝난다.

    // "X의 a%" 를 쉬운 a로 구하는 줄들
    const ps_half = X => ['50%', `${X}의 절반 = ${X / 2}`];
    const ps_quarter = (X, head = '25%') => [head, X >= 100 ? `${X} ÷ 4 = ${X / 2} ÷ 2 = ${X / 4}` : `${X} ÷ 4 = ${X / 4}`];
    const ps_eighth = X => ['÷8', X >= 100 ? `${X} ÷ 8 = ${X / 2} ÷ 4 = ${X / 8}` : `${X} ÷ 8 = ${X / 8}`];
    const ps_fifth = X => ['20%', X > 45 ? `${X} ÷ 5 = ${X * 2} ÷ 10 = ${X / 5}` : `${X} ÷ 5 = ${X / 5}`];
    const ps_times = (head, v, k) => [head, `${v} × ${k} = ${v * k}`];
    const ps_plus = (head, X, v) => [head, `${X} + ${v} = ${X + v}`];

    // 쉬운 % a → { need: X가 need의 배수면 중간값이 모두 정수, steps: 풀이 줄, line: 팁 한 줄 }
    const ps_WAYS = {
      50:   { need: 2, steps: X => [ps_half(X)],
              line: X => `= ${X}의 절반 = ${X / 2}` },
      25:   { need: 4, steps: X => [ps_quarter(X)],
              line: X => `= ${X} ÷ 4 = ${X / 4}` },
      20:   { need: 5, steps: X => [ps_fifth(X)],
              line: X => `= ${X} ÷ 5 = ${X / 5}` },
      75:   { need: 4, steps: X => [ps_quarter(X), ps_times('75%', X / 4, 3)],
              line: X => `= ${X} ÷ 4 × 3 = ${X / 4} × 3 = ${X * 3 / 4}` },
      120:  { need: 5, steps: X => [ps_fifth(X), ps_plus('120%', X, X / 5)],
              line: X => `= ${X} + ${X} ÷ 5 = ${X} + ${X / 5} = ${X * 6 / 5}` },
      125:  { need: 4, steps: X => [ps_quarter(X), ps_plus('125%', X, X / 4)],
              line: X => `= ${X} + ${X} ÷ 4 = ${X} + ${X / 4} = ${X * 5 / 4}` },
      150:  { need: 2, steps: X => [ps_half(X), ps_plus('150%', X, X / 2)],
              line: X => `= ${X} + ${X}의 절반 = ${X} + ${X / 2} = ${X * 3 / 2}` },
      250:  { need: 2, steps: X => [ps_half(X), ps_times('250%', X / 2, 5)],
              line: X => `= ${X}의 절반 × 5 = ${X / 2} × 5 = ${X * 5 / 2}` },
    };
    for (const k of [2, 3, 4]) {   // 40·60·80% = 20% × 2·3·4
      ps_WAYS[20 * k] = { need: 5, steps: X => [ps_fifth(X), ps_times(`${20 * k}%`, X / 5, k)],
                          line: X => `= ${X} ÷ 5 × ${k} = ${X / 5} × ${k} = ${X * k / 5}` };
    }
    // 자료 크기의 기준값: 1/4·1/8 묶음 × 10·100 (750 = 3/4 × 1000, 1250 = 1/8 × 10000 …)
    // [A, 나눌 수, 곱할 수, "a% = …배 = …배 ÷ q"]
    for (const [a, q, k, why] of [[750, 4, 30, '7.5배 = 30배 ÷ 4'], [2500, 4, 100, '25배 = 100배 ÷ 4'],
                                  [1250, 8, 100, '12.5배 = 100배 ÷ 8'], [375, 8, 30, '3.75배 = 30배 ÷ 8'],
                                  [625, 8, 50, '6.25배 = 50배 ÷ 8']]) {
      ps_WAYS[a] = { need: q, why: `${a}% = ${why}`,
                     steps: X => [q === 4 ? ps_quarter(X, '÷4') : ps_eighth(X), ps_times(`×${k}`, X / q, k)],
                     line: X => `= ${X} ÷ ${q} × ${k} = ${X / q} × ${k} = ${X * a / 100}` };
    }

    // "A의 B%" 가 이미 쉬운 B: 10의 배수(10% 덩어리), 25의 배수, 1·2·4·5%
    const ps_easyB = B => B % 10 === 0 || B % 25 === 0 || [1, 2, 4, 5].includes(B);

    // A의 B% 풀이 팁: A가 100 이하의 쉬운 %(20·25·40·50·60·75·80)이고 B는 덩어리로 세기 번거로울 때만
    // (15%는 10% + 그 절반으로 이미 쉬워서 뺀다)
    swapTip = (A, B) => {
      const w = A <= 100 && ps_WAYS[A];
      return w && B % w.need === 0 && !ps_easyB(B) && B !== 15 ? tip('뒤집기', `${A}의 ${B}% = ${B}의 ${A}%`, w.line(B)) : null;
    };

    // 같은 답을 내는 다른 길 (있을 때만). X는 늘 ps_WAYS[A].need의 배수라 중간값이 모두 정수
    function ps_altTip(A, X) {
      const h = X / 2, ans = A * X / 100;
      if (ps_WAYS[A].why) return tip('배수로 보기', ps_WAYS[A].why);
      if (A === 50 && X >= 100) {
        const a = X - X % 100, b = X % 100;   // 138 = 100 + 38 → 50 + 19
        return tip('쪼개서 절반', `${X} = ${a} + ${b}`, `→ ${a / 2} + ${b / 2} = ${h}`);
      }
      switch (A) {
        case 25:  return X < 100 ? tip('다른 길', '25% = 절반의 절반', `${X} → ${h} → ${X / 4}`) : null;
        case 75:  return tip('다른 길', '75% = 100% − 25%', `${X} − ${X / 4} = ${ans}`);
        case 40:  return tip('다른 길', '40% = 2/5', `${X} × 2 = ${X * 2} → ÷ 5 = ${ans}`);
        case 60:  return tip('다른 길', '60% = 100% − 40%', `${X} − ${X * 2 / 5} = ${ans}`);
        case 80:  return tip('다른 길', '80% = 100% − 20%', `${X} − ${X / 5} = ${ans}`);
        case 125: return tip('다른 길', '125% = 5/4', `${X} ÷ 4 × 5 = ${X / 4} × 5 = ${ans}`);
        case 150: return tip('다른 길', '150% = 3/2', `${X} ÷ 2 × 3 = ${h} × 3 = ${ans}`);
        case 250: return tip('다른 길', '250% = 200% + 50%', `${X * 2} + ${h} = ${ans}`);
      }
      return null;   // 20%는 본 풀이(÷5 = ×2 ÷ 10)가 이미 그 길
    }

    // 뒤집으면 쉬운 A (자주 나올 것을 여러 번 넣음). B는 6~99%가 대부분, 가끔 101~199%(증가율·배율 꼴).
    // 문제 공간이 원래 작다(약 560개): A는 쉬운 %로 고정이고, B는 이미 쉬운 수(10·25의 배수 등)를 빼야 하므로.
    const ps_SWAP_A = [25, 25, 25, 50, 50, 50, 20, 40, 60, 80, 75, 75, 150, 250, 125, 120,
                       750, 750, 2500, 2500, 1250, 1250, 375, 625];

    TYPES.swap = {
      section: 'pct', title: '뒤집기', ex: '25의 16% = 16의 25%', fields: ['A', 'B'],
      gen() {
        const A = pick(ps_SWAP_A), m = ps_WAYS[A].need;
        const [lo, hi] = coin(0.1) ? [101, 199] : [m === 5 ? 11 : 6, 99];
        for (;;) {
          const B = m * rnd(Math.ceil(lo / m), Math.floor(hi / m));
          if (!ps_easyB(B)) return { t: 'swap', A, B };
        }
      },
      answer: p => p.A * p.B / 100,
      prompt: p => ({ main: `${p.A} × ${p.B}%`, sub: `${p.A}의 ${p.B}%는?` }),
      label: p => `${p.A}의 ${p.B}%`,
      hint: p => {
        const { A, B } = p, tips = [], alt = ps_altTip(A, B);
        if (alt) tips.push(alt);
        tips.push(tip('뒤집기 원리', `${A}의 ${B}% = ${A} × ${B} ÷ 100`, `= ${B} × ${A} ÷ 100 = ${B}의 ${A}%`));
        return { steps: [['뒤집기', `${A}의 ${B}% = ${B}의 ${A}%`], ...ps_WAYS[A].steps(B)], tips };
      },
    };

    // ---------- 분수 → % ----------
    // 분모 묶음 [뽑을 비율(%), 분모들]. 답(%)이 정수가 되는 분자만 쓰므로 문제 공간은 약 8,000개
    const ps_DENOMS = [
      [24, [20, 25, 50]],                                         // 곱해서 100
      [36, [200, 300, 400, 500, 600, 700, 800, 900, 1200, 1500, 1600,
            2000, 2400, 3000, 4000, 5000, 6000, 8000]],           // 나눠서 100
      [14, [125, 250, 1250, 2500]],                               // ×8·×4 해서 1000·10000
      [21, [30, 40, 60, 70, 75, 80, 90, 120, 140, 150, 160, 175, 180, 225,
            240, 320, 350, 360, 375, 450, 480, 550, 650, 750]],   // 약분 먼저
      [5,  [4, 5, 10, 12, 15, 24, 35, 45]],                       // 몸풀기: 1/4·1/5·1/10 꼴
    ];
    function ps_pickDenom() {
      let r = rnd(1, 100);
      for (const [w, ds] of ps_DENOMS) if ((r -= w) <= 0) return pick(ds);
    }
    const ps_X1000 = d => [125, 250, 1250, 2500].includes(d);   // ×8·×4 하면 1000·10000
    const ps_EIGHTHS = ['1/8 = 12.5%, 3/8 = 37.5%', '5/8 = 62.5%, 7/8 = 87.5%'];

    // 꼭 외워 둘 분수 (분모에 맞춰 고른 표)
    function ps_tableTip(d) {
      if (d % 3 === 0) return tip('외워 두기', '1/3 ≈ 33.3%, 2/3 ≈ 66.7%', '1/6 ≈ 16.7%, 5/6 ≈ 83.3%', '1/12 ≈ 8.3%, 1/15 ≈ 6.7%');
      if (ps_X1000(d)) return tip('외워 두기', ...ps_EIGHTHS, '1/125 = 0.8%, 1/250 = 0.4%');
      if ([40, 80, 160, 320].includes(d)) return tip('외워 두기', ...ps_EIGHTHS, d % 80 ? '1/16 = 6.25%, 1/40 = 2.5%' : '1/16 = 6.25%, 1/80 = 1.25%');
      if (d % 7 === 0) return tip('외워 두기', '1/7 ≈ 14.3%, 2/7 ≈ 28.6%', '3/7 ≈ 42.9%, 1/14 ≈ 7.1%');
      return tip('외워 두기', '1/8 = 12.5%, 1/6 ≈ 16.7%', '1/7 ≈ 14.3%, 1/9 ≈ 11.1%', '1/3 ≈ 33.3%, 1/11 ≈ 9.1%');
    }

    // 눈에 보이는 약분만 이어서: 끝의 0(÷10·÷100…)을 먼저 지우고, 분자가 분모를 나누면 한 번에,
    // 아니면 한눈에 보이는 큰 수(25·24·20·16·15·…)부터. 예) 390/650 = 39/65 = 3/5
    const ps_GLANCE = [25, 24, 20, 18, 16, 15, 14, 13, 12, 11, 9, 8, 7, 6, 5, 4, 3, 2];
    function ps_reduceChain(n, d) {
      const parts = [`${n}/${d}`];
      for (let g = gcd(n, d); g > 1; g = gcd(n, d)) {
        let f = 1;
        while (g % (f * 10) === 0) f *= 10;
        if (f === 1) f = n === g ? g : ps_GLANCE.find(q => g % q === 0) || g;
        n /= f; d /= f;
        parts.push(`${n}/${d}`);
      }
      return parts.join(' = ');
    }

    TYPES.frac = {
      section: 'pct', title: '분수 → %', ex: '13/20 = 65%', unit: '%', fields: ['A', 'B'],
      gen() {
        const d = ps_pickDenom(), s = 100 / gcd(d, 100);   // 답(%)이 s의 배수여야 분자가 정수
        const [lo, hi] = coin(0.25) ? [101, 300] : [1, 99];
        for (;;) {
          const P = s * rnd(Math.ceil(lo / s), Math.floor(hi / s));
          if (P % 100) return { t: 'frac', A: P * d / 100, B: d };
        }
      },
      answer: p => p.A * 100 / p.B,
      prompt: p => ({ main: `${p.A}/${p.B}`, sub: `${p.A}/${p.B}${eun(p.A)} 몇 %?` }),
      label: p => `${p.A}/${p.B}${eun(p.A)} 몇 %`,
      heading: p => `${p.A}/${p.B} = ${p.A * 100 / p.B}%`,
      hint: p => {
        const n = p.A, d = p.B, P = n * 100 / d, full = `${n}/${d} = ${P}/100 = ${P}%`;
        const done = ['답', full.length <= 26 ? full : `${P}/100 = ${P}%`];   // 다섯 자리 분자는 짧게
        // 답이 정수 %라서 끝까지 약분하면 분모(dr)는 늘 100의 약수
        const g = gcd(n, d), nr = n / g, dr = d / g, reduce = ['약분', ps_reduceChain(n, d)];
        let steps, quick = false;
        if (100 % d === 0) {                       // 곱해서 100
          const k = 100 / d;
          steps = [['분모', `${d} × ${k} = 100`], ['분자', `${n} × ${k} = ${P}`], done];
        } else if (dr <= 10 && nr < dr && (d % 100 || g <= 100)) {
          // 아는 진분수(1/2·3/4·2/5·7/10 …)로 바로. 분모가 100의 배수면 큰 약분보다 ÷(d/100)이 빠르다
          quick = true;
          steps = [reduce, ['답', `${nr}/${dr} = ${P}%`]];
        } else if (ps_X1000(d)) {                  // 곱해서 1000·10000 (÷25 = ×4÷100)
          const k = d === 125 || d === 1250 ? 8 : 4;
          steps = [['분모', `${d} × ${k} = ${d * k}`], ['분자', `${n} × ${k} = ${n * k}`], ['답', `${n * k}/${d * k} = ${P}%`]];
        } else if (d % 100 === 0) {                // 나눠서 100
          const k = d / 100;
          steps = [['분모', `${d} ÷ ${k} = 100`], ['분자', `${n} ÷ ${k} = ${P}`], done];
        } else {                                   // 약분해서 분모 20·25·50 → 곱해서 100
          const k = 100 / dr;
          steps = [reduce, ['분모', `${dr} × ${k} = 100`], ['분자', `${nr} × ${k} = ${P}`], done];
        }
        const tips = [];
        if (n > d) {
          const w = Math.floor(n / d);
          tips.push(tip('대분수', `${n}/${d} = ${w} + ${n - w * d}/${d}`, `→ ${100 * w}% + ${P - 100 * w}% = ${P}%`));
        } else if (!quick && ps_X1000(d)) {      // 아는 분수로 끝났으면 다른 길은 생략
          const f = d < 1000 ? 5 : 25;
          tips.push(tip('다른 길', `위아래 ÷ ${f}: ${n}/${d} = ${n / f}/${d / f}`, d / f === 100 ? `= ${P}%` : `= ${P}/100 = ${P}%`));
        } else if (!quick && d === 40) {
          tips.push(tip('다른 길', `1/40 = 2.5% → ${n} × 2.5% = ${P}%`));
        }
        tips.push(ps_tableTip(d));
        return { steps, tips };
      },
    };

  // ===== 퍼센트: %p와 % · 연속 증감 확장 =====
    // ---------- 퍼센트 확장: %p와 % ----------
    // 비율 r1% → r2%. %p = 비율끼리 뺀 차이, % = 그 차이를 처음 비율로 나눈 증감률.

    // 비율 이름과 그럴듯한 범위 [이름, 최소, 최대]. 모두 받침으로 끝나서 뒤에 "은"
    const pp_CTX = [
      ['시장 점유율', 1, 90], ['실업률', 1, 20], ['고용률', 30, 90], ['투표율', 20, 95],
      ['합격률', 5, 95], ['취업률', 20, 95], ['흡연율', 5, 50], ['불량률', 1, 20],
      ['보급률', 1, 99], ['가입률', 1, 99], ['응답 비율', 1, 99], ['수출 비중', 1, 90],
      ['득표율', 5, 90], ['진학률', 10, 99], ['이용률', 1, 99], ['재구매율', 5, 90],
    ];

    // 증감률이 정수인 (r1, r2) 쌍 모음: 차이 × 100 이 r1로 나누어떨어짐.
    // 쌍 전체 / 처음 비율별 / 증감률별로 묶어 두고 셋 중 하나를 고르게 뽑는다 (50%·25%만 반복되지 않게)
    function pp_pool(keep) {
      const pairs = [], byStart = {}, byRel = {};
      for (let a = 1; a <= 99; a++) for (let b = 1; b <= 99; b++) {
        const d = Math.abs(b - a), rel = 100 * d / a;
        if (a === b || 100 * d % a || !keep(a, b, rel)) continue;
        pairs.push([a, b]);
        (byStart[a] = byStart[a] || []).push([a, b]);
        (byRel[rel] = byRel[rel] || []).push([a, b]);
      }
      // 묶음은 고를 거리가 여럿인 것만 (37% → 74%, 50% → 49% 같은 외톨이만 반복되지 않게)
      return [[pairs], Object.values(byStart).filter(x => x.length >= 3), Object.values(byRel).filter(x => x.length >= 2)];
    }
    const pp_DOWN = pp_pool((a, b, rel) => b < a && rel <= 50);
    const pp_DOWN_BIG = pp_pool((a, b, rel) => b < a && rel > 50);
    const pp_UP = pp_pool((a, b, rel) => b > a && rel <= 100);
    const pp_UP_BIG = pp_pool((a, b, rel) => b > a && rel > 100 && rel <= 400);

    const pp_d = p => Math.abs(p.B - p.A);
    const pp_rel = p => 100 * pp_d(p) / p.A;
    const pp_up = p => p.B > p.A ? '증가' : '감소';

    // d ÷ r1 을 %로. r1이 100의 약수면 바로 ×(100÷r1) (÷50 = ×2/100).
    // 아니면 약분 → (가분수면 소수, 분모 20·25·50이면 /100) → %
    function pp_relChain(d, r1) {
      if (r1 === 1) return [String(d), `${100 * d}%`];
      if (100 % r1 === 0) return [`${d}×${100 / r1}/100`, `${100 * d / r1}%`];
      const g = gcd(d, r1), a = d / g, b = r1 / g, out = [];
      if (b === 1) { if (g > 1) out.push(String(a)); }
      else {
        if (g > 1) out.push(`${a}/${b}`);
        if (a > b) out.push(fmt(a / b));
        else if (b >= 20) out.push(`${a * 100 / b}/100`);
      }
      out.push(`${100 * d / r1}%`);
      return out;
    }

    TYPES.pp = {
      section: 'pct', title: '%p와 %', ex: '20% → 25%: 5%p', fields: ['A', 'B', 'q', 'c'],
      gen() {
        // 감소 45% (그중 절반 넘게 줄어드는 것은 1/4), 증가 55% (그중 두 배 넘게 느는 것은 1/4)
        const pool = coin(0.45) ? (coin(0.75) ? pp_DOWN : pp_DOWN_BIG) : (coin(0.75) ? pp_UP : pp_UP_BIG);
        const [A, B] = pick(pick(pick(pool)));
        const lo = Math.min(A, B), hi = Math.max(A, B);
        const fit = pp_CTX.map((x, i) => i).filter(i => pp_CTX[i][1] <= lo && hi <= pp_CTX[i][2]);
        return { t: 'pp', A, B, q: coin() ? 1 : 2, c: pick(fit) };
      },
      answer: p => p.q === 1 ? pp_d(p) : pp_rel(p),
      unit: p => p.q === 1 ? '%p' : '%',
      finalToken: p => `${TYPES.pp.answer(p)}${p.q === 1 ? '%p' : '%'}`,
      prompt: p => ({ main: `${p.A}% → ${p.B}%`, sub: `${pp_CTX[p.c][0]}은 몇 ${p.q === 1 ? '%p' : '%'} ${pp_up(p)}했나요?` }),
      label: p => `${pp_CTX[p.c][0]} ${p.A}% → ${p.B}% ${pp_up(p)}${p.q === 1 ? '폭' : '율'}`,
      hint: p => {
        const d = pp_d(p), rel = pp_rel(p), u = pp_up(p);
        const diff = ['차이', `${Math.max(p.A, p.B)} − ${Math.min(p.A, p.B)} = ${d}`];
        const steps = p.q === 1
          ? [diff, ['%라면', `${d} ÷ ${p.A} = ${rel}% ${u}`], ['%p', `${d}%p ${u}`]]
          : [diff, ['%p라면', `${d}%p ${u}`], ['%', `${d} ÷ ${p.A} (처음 비율)`], ['', `= ${pp_relChain(d, p.A).join(' = ')} ${u}`]];
        return {
          steps,
          tips: [tip('%p와 %', '%p는 비율끼리 빼기', '%는 처음 비율로 나누기'),
                 tip('함정', `"${d}% ${u}"는 틀린 말이에요`, `${d}%p ${u} 또는 ${rel}% ${u}`)],
        };
      },
    };

    // ---------- 연속 증감: 문제 늘리기 ----------
    // A, B ∈ −60~+90 (0 제외), (100+A)(100+B)가 100의 배수이고 결과 ≠ 100.
    // 둘 다 5의 배수인 쌍(433개, 그중 둘 다 ±50 이내 core)과,
    // 한쪽이 ±25·±50·75이고 다른 쪽이 −8·+12·+36 같은 5의 배수 아닌 수인 쌍(280개)
    const pp_TWICE = (() => {
      const core = [], five = [], mixed = [];
      for (let a = -60; a <= 90; a++) for (let b = -60; b <= 90; b++) {
        const v = (100 + a) * (100 + b);
        if (!a || !b || v % 100 || v === 10000) continue;
        if (a % 5 === 0 && b % 5 === 0) {
          five.push([a, b]);
          if (Math.abs(a) <= 50 && Math.abs(b) <= 50) core.push([a, b]);
        } else if (Math.abs(a % 5 ? a : b) <= 48) mixed.push([a, b]);
      }
      return { core, five, mixed };
    })();

    TYPES.twice.gen = function () {
      const T = pp_TWICE, [A, B] = pick(coin(0.45) ? T.core : coin(0.35) ? T.five : T.mixed);
      return { t: 'twice', A, B, dir: 1 };
    };

    // 팁 한 줄이 34자를 넘지 않게 연속 증감 팁만 다시 쓴다 (풀이 줄은 그대로)
    const pp_twiceHint = TYPES.twice.hint;
    TYPES.twice.hint = p => {
      const h = pp_twiceHint(p), r = (100 + p.A) * (100 + p.B) / 100 - 100, c = p.A * p.B / 100;
      const pr = x => x < 0 ? `(−${-x})` : String(x), sn = x => x < 0 ? `−${-x}` : String(x);
      h.tips = [tip('주의', '두 증감률을 그냥 더하면 안 돼요',
        `${pr(p.A)} + ${pr(p.B)} + ${pr(p.A)}×${pr(p.B)}÷100`,
        `= ${sn(p.A + p.B)} ${sg(c)} ${Math.abs(c)} = ${sg(r)}${Math.abs(r)}%`)];
      return h;
    };

  // ===== 나눗셈: 세 자리 ÷ 한 자리 · 네 자리 ÷ 두 자리 =====
    // ---------- 나눗셈: 나누어떨어지는 나눗셈 ----------
    // p = { A: 나누는 수, B: 몫 }. 나눌 수는 A × B 로 계산한다 (id는 "div1:8:96").
    const dl_N = p => p.A * p.B;
    const dl_PLACE = ['백의자리', '십의자리', '일의자리'];

    // lo~hi 에서 몫을 뽑되, 10의 배수는 rate 확률로 다시 뽑는다 (너무 쉬운 문제 줄이기)
    function dl_q(lo, hi, rate) {
      for (;;) { const q = rnd(lo, hi); if (q % 10 || !coin(rate)) return q; }
    }
    // 나누는 수: 10의 배수는 rate 확률로 다시 뽑기
    function dl_div(lo, hi, rate) {
      for (;;) { const a = rnd(lo, hi); if (a % 10 || !coin(rate)) return a; }
    }

    // "a = b = c ..." 를 짧은 줄로 끊기 (마지막 답은 되도록 앞 줄에 붙인다)
    function dl_wrap(terms) {
      const lines = [terms[0]];
      terms.slice(1).forEach((t, i, rest) => {
        const k = lines.length - 1, joined = `${lines[k]} = ${t}`;
        if (joined.length <= (i === rest.length - 1 ? 34 : 24)) lines[k] = joined;
        else lines.push(`= ${t}`);
      });
      return lines;
    }

    // 끝자리 맞추기: 나누는 수 끝자리가 1·3·7·9면 몫의 끝자리가 하나로 정해진다.
    // 몫이 두 자리일 때만 (세 자리면 '몇십 대'를 찾는 데 이미 나눗셈을 거의 다 하게 된다)
    function dl_lastTip(N, d, q) {
      const a1 = d % 10, o = q % 10, u = N % 10;
      if (![1, 3, 7, 9].includes(a1) || !o || q >= 100) return null;
      const src = d < 10 ? `${d}` : `${d}의 끝 ${a1}`;
      return tip('끝자리 맞추기', `${src} × ${o} = ${a1 * o} → ${N}의 끝 ${u}`,
                 `끝이 ${u}${ga(u)} 되는 몫 끝자리는 ${o}뿐이에요`, `어림으로 몫은 ${q - o}대 → ${q}`);
    }

    // ---------- 세 자리 ÷ 한 자리: 장제법 ----------
    // 앞자리부터 한 자리씩: "76 ÷ 8 = 9 … 4" → 나머지 뒤에 다음 숫자를 붙여 "48 ÷ 8 = 6"
    function dl_longSteps(N, d) {
      const digits = String(N).split('').map(Number), place = dl_PLACE.slice(-digits.length);
      const steps = [];
      let cur = 0;
      digits.forEach((x, i) => {
        cur = cur * 10 + x;
        const qd = Math.floor(cur / d), r = cur % d;
        if (!steps.length && !qd) return;   // 맨 앞자리가 d보다 작으면 다음 자리까지 붙여서
        let v = qd ? `${cur} ÷ ${d} = ${qd}${r ? ` … ${r}` : ''}`
                   : cur ? `${cur} < ${d} → 몫에 0` : '0이라 몫에 0';
        if (!steps.length && i > 0) v = `${digits[0]} < ${d} → ${v}`;
        steps.push([place[i], v]);
        cur = r;
      });
      return steps;
    }

    // 다른 길: 몫을 10 단위로 끊어 나누기 쉬운 두 덩어리로
    function dl_routeTip(N, d, q) {
      const o = q % 10;
      if (!o) return tip('0 떼기', `${N / 10} ÷ ${d} = ${q / 10} → ${N} ÷ ${d} = ${q}`);
      if (o >= 8) {
        const hi = q + 10 - o;
        return tip('빼서 나누기', `${N} = ${d * hi} − ${d * (10 - o)} (둘 다 ${d}의 배수)`, `→ ${hi} − ${10 - o} = ${q}`);
      }
      const lo = q - o;
      return tip('쪼개서 나누기', `${N} = ${d * lo} + ${d * o} (둘 다 ${d}의 배수)`, `→ ${lo} + ${o} = ${q}`);
    }

    // 나누는 수에 맞춘 지름길
    function dl_oneTip(N, d, q) {
      switch (d) {
        case 4: return tip('÷4 = 반의 반', `${N} → ${N / 2} → ${q}`);
        case 8: return tip('÷8 = 반씩 세 번', `${N} → ${N / 2} → ${N / 4} → ${q}`);
        case 5: return tip('÷5 = ×2 ÷10', `${N} × 2 = ${N * 2}`, `${N * 2} ÷ 10 = ${q}`);
        case 6: return tip('÷6 = 반 → ÷3', `${N} ÷ 2 = ${N / 2}`, `${N / 2} ÷ 3 = ${q}`);
        case 3: case 7: case 9: return dl_lastTip(N, d, q);
      }
      return null;
    }

    TYPES.div1 = {
      section: 'div', title: '세 자리 ÷ 한 자리', ex: '768 ÷ 8 = 96', fields: ['A', 'B'],
      gen() {
        const A = coin(0.05) ? 2 : pick([3, 4, 5, 6, 6, 7, 7, 8, 8, 9, 9]);
        return { t: 'div1', A, B: dl_q(Math.max(12, Math.ceil(100 / A)), Math.floor(999 / A), 0.8) };
      },
      answer: p => p.B,
      prompt: p => ({ main: `${dl_N(p)} ÷ ${p.A}`, sub: '나누어떨어져요. 몫은?' }),
      label: p => `${dl_N(p)} ÷ ${p.A}`,
      heading: p => `${dl_N(p)} ÷ ${p.A} = ${p.B}`,
      hint: p => {
        const N = dl_N(p), d = p.A, q = p.B;
        const route = dl_routeTip(N, d, q), own = dl_oneTip(N, d, q);
        return {
          steps: [...dl_longSteps(N, d), ['몫', `${q} (검산 ${d} × ${q} = ${N})`]],
          tips: ([4, 5, 8].includes(d) ? [own, route] : [route, own]).filter(Boolean),
        };
      },
    };

    // ---------- 네 자리 ÷ 두 자리: 몫 어림 덩어리 빼기 ----------
    // 몫을 가까운 10 단위 R로 어림해 A × R 을 빼고(넘치면 거꾸로 빼고), 남은 몇 배만 더하거나 뺀다.
    function dl_chunkSteps(N, A, q) {
      if (q % 10 === 0 && (q < 100 || q % 100 === 0)) {   // 0을 떼면 바로 끝나는 몫
        const z = q % 100 ? 10 : 100;
        return [['0 떼기', `${N / z} ÷ ${A} = ${q / z}`], ['몫', `${q} (검산 ${A} × ${q} = ${N})`]];
      }
      const o = q % 10, t = q % 100;
      const R = q >= 100 && t >= 91 ? q - t + 100              // 193 → 200 − 7
              : o >= 6 && (q < 100 || t > 10) ? q + 10 - o     // 48 → 50 − 2, 248 → 250 − 2
              : q - o;                                         // 42 → 40 + 2, 214 → 210 + 4
      const chunks = R >= 100 && R % 100 ? [R - R % 100, R % 100] : [R];
      const steps = [];
      let rem = N;
      chunks.forEach((c, i) => {
        const P = A * c;
        steps.push([i ? '' : '어림', `${A} × ${c} = ${P}`]);
        if (rem > P) steps.push(['남은 수', `${rem} − ${P} = ${rem - P}`]);
        else if (rem < P) steps.push(['넘친 수', `${P} − ${rem} = ${P - rem}`]);
        rem -= P;
      });
      const k = Math.abs(rem) / A;
      if (k) steps.push(['', `${Math.abs(rem)} ÷ ${A} = ${k}`]);
      steps.push(['몫', `${chunks.join(' + ')}${k ? ` ${rem > 0 ? '+' : '−'} ${k}` : ''} = ${q}`]);
      return steps;
    }

    // 나누는 수를 바꿔 쉽게: 0 지우기, ×2·×4 로 0 만들기, 반씩 나누기.
    // 바꾼 나누는 수가 12 넘게 남으면 더 쉬워지지 않으니 팁을 안 낸다.
    function dl_shortTip(N, A, q) {
      if (A % 10 === 0) return tip('0 지우기', `${N} ÷ ${A} = ${N / 10} ÷ ${A / 10} = ${q}`);
      if (A === 25) return tip('÷25 = ×4 ÷100', `${N} × 4 = ${N * 4}`, `${N * 4} ÷ 100 = ${q}`);
      if (A === 75) return tip('÷75 = ×4 ÷300', `${N} × 4 = ${N * 4}`, `${N * 4} ÷ 300 = ${N * 4 / 100} ÷ 3 = ${q}`);
      if (A % 5 === 0) {   // 15·35·45·55 → ×2 하면 ÷3·÷7·÷9·÷11
        if (A * 2 / 10 > 11) return null;
        return tip(`÷${A} = ×2 ÷${A * 2}`, ...dl_wrap([`${N} ÷ ${A}`, `${N * 2} ÷ ${A * 2}`, `${N * 2 / 10} ÷ ${A * 2 / 10}`, q]));
      }
      if (A % 2) return null;
      const terms = [`${N} ÷ ${A}`];
      let n = N, a = A;
      while (a % 2 === 0 && a > 9) { n /= 2; a /= 2; terms.push(`${n} ÷ ${a}`); }
      if (a > 12) return null;
      terms.push(String(q));
      return tip('반씩 나누기', ...dl_wrap(terms));
    }

    // 어림 검산: 나누는 수를 나누기 쉬운 수(가까운 10의 배수, 23~27은 25, 95 이상은 100)로 바꿔 몫의 자리를 가늠
    function dl_estTip(N, A, q) {
      if (A < 18 || A % 10 === 0 || A === 25 || A === 75) return null;
      const A2 = A >= 95 ? 100 : Math.abs(A - 25) <= 2 ? 25 : Math.round(A / 10) * 10;
      const e10 = Math.round(N * 10 / A2), exact = (N * 10) % A2 === 0;
      const big = A2 > A;
      return tip('어림 검산', `${A} ≈ ${A2}: ${N} ÷ ${A2} ${exact ? '=' : '≈'} ${fmt(e10 / 10)}`,
                 `나누는 수를 ${big ? '키웠' : '줄였'}으니 실제 몫은 더 ${big ? '커요' : '작아요'} → ${q}`);
    }

    TYPES.div2 = {
      section: 'div', title: '네 자리 ÷ 두 자리', ex: '1428 ÷ 34 = 42', fields: ['A', 'B'],
      gen() {
        if (coin(0.25)) {   // 몫이 세 자리 (2568 ÷ 12 = 214)
          const A = dl_div(12, 49, 0.75);
          return { t: 'div2', A, B: dl_q(100, Math.floor(9999 / A), 0.85) };
        }
        const A = dl_div(12, 99, 0.75);
        return { t: 'div2', A, B: dl_q(Math.max(11, Math.ceil(1000 / A)), 99, 0.85) };
      },
      answer: p => p.B,
      prompt: p => ({ main: `${dl_N(p)} ÷ ${p.A}`, sub: '나누어떨어져요. 몫은?' }),
      label: p => `${dl_N(p)} ÷ ${p.A}`,
      heading: p => `${dl_N(p)} ÷ ${p.A} = ${p.B}`,
      hint: p => {
        const N = dl_N(p), A = p.A, q = p.B;
        // 끝자리 맞추기(나누는 수가 홀수)와 지름길(짝수·5의 배수)은 함께 나오지 않는다
        const main = dl_lastTip(N, A, q) || dl_shortTip(N, A, q);
        const tips = [main, dl_estTip(N, A, q)];
        return { steps: dl_chunkSteps(N, A, q), tips: tips.filter(Boolean) };
      },
    };

  // ===== 나눗셈: 어림 =====
    // ---------- 나눗셈: 어림 ----------
    // p = { N, d, k }: k = 0 → N ÷ d 의 몫 어림, k = 1 → N이 d의 몇 %인지 어림 (id는 "est:3847:47:0")
    // 정답은 반올림한 정수. 허용 범위: 몫은 ±max(1, 3%), 비율은 ±1%p.
    // GSAT 선택지는 보통 3~5% 넘게 벌어져 있어 3% 안이면 고를 수 있다. 비율은 %p로 비교하므로 ±1%p.
    // 몫은 20 이상만 낸다 (한 자리 몫에 ±1이면 아무 어림이나 정답이 된다).

    // 나누기 쉬운 수: 한 자리 수 × 10ⁿ, 25·125 × 10ⁿ (÷25 = ×4, ÷125 = ×8)
    const de_FRIENDLY = [];
    for (let z = 1; z <= 10000; z *= 10) for (const m of [10, 20, 25, 30, 40, 50, 60, 70, 80, 90, 100, 125]) de_FRIENDLY.push(m * z);
    const de_near = d => de_FRIENDLY.reduce((b, D) => Math.abs(D - d) < Math.abs(b - d) ? D : b);

    // a ÷ b 를 소수 dp자리로 반올림 (a, b는 정수): { v: 10^dp 배 정수, s: 보이는 글자, eq: '=' | '≈' }
    function de_div(a, b, dp) {
      const z = 10 ** dp, v = Math.round(a * z / b);
      return { v, s: fmt(v / z), eq: (a * z) % b === 0 ? '=' : '≈' };
    }
    const de_num = p => p.k ? 100 * p.N : p.N;            // 구할 값 = de_num ÷ d
    const de_x = p => de_div(de_num(p), p.d, 2);         // 정확한 값 (소수 둘째 자리)
    const de_ans = p => Math.round(de_num(p) / p.d);
    const de_pct = p => p.k ? '%' : '';
    const de_what = p => p.k ? '비율' : '몫';

    // 허용 범위: 몫 |v − N/d| ≤ max(1, 3%), 비율 |v − 100N/d| ≤ 1 (정수끼리 비교)
    const de_ok = (p, v) => p.k ? Math.abs(v * p.d - 100 * p.N) <= p.d
                                : 100 * Math.abs(v * p.d - p.N) <= Math.max(100 * p.d, 3 * p.N);

    // 반올림이 애매한 문제는 버린다: 나누어떨어짐, 소수 둘째 자리 아래가 딱 5, .5 근처, 거의 정수
    function de_clean(N, d, k) {
      const s = k ? 100 * N : N, f = (s % d) / d;
      if (!(s % d) || ((200 * s) % d === 0 && (100 * s) % d !== 0)) return false;
      return f >= 0.005 && f <= 0.995 && Math.abs(f - 0.5) >= 0.005;
    }
    function de_divisor(lo, hi) {
      for (;;) { const d = rnd(lo, hi); if (!de_FRIENDLY.includes(d)) return d; }
    }

    // 몫 어림: 세 자리 ÷ 두 자리 ~ 다섯 자리 ÷ 세 자리, 몫은 20 이상
    function de_genQ() {
      const r = Math.random();
      const [nd, dd] = r < 0.15 ? [3, 2] : r < 0.45 ? [4, 2] : r < 0.65 ? [4, 3] : r < 0.75 ? [5, 2] : [5, 3];
      const dHi = Math.min(10 ** dd - 1, Math.floor((10 ** nd - 1) / 20));   // 세 자리 ÷ 49, 네 자리 ÷ 499 까지
      for (;;) {
        const d = de_divisor(10 ** (dd - 1) + 1, dHi);
        const N = rnd(Math.max(10 ** (nd - 1), 20 * d), 10 ** nd - 1);
        if (de_clean(N, d, 0)) return { t: 'est', N, d, k: 0 };
      }
    }
    // 비율 어림: 전체 d(세~다섯 자리) 중 N이 3~97%
    function de_genP() {
      const r = Math.random();
      for (;;) {
        const d = r < 0.3 ? de_divisor(120, 999) : r < 0.75 ? de_divisor(1000, 9999) : de_divisor(10000, 99999);
        const N = rnd(Math.ceil(0.03 * d), Math.floor(0.97 * d));
        if (N >= 10 && de_clean(N, d, 1)) return { t: 'est', N, d, k: 1 };
      }
    }

    // 나누기 쉬운 수 D로 바꿔 어림 E를 구하고 보정한다.
    // 나누는 수를 d → D 로 q = |D − d| ÷ d 만큼 키우면(줄이면) 실제 값은 정확히 (N ÷ D) × (1 ± q). q는 정수 P%로 반올림해 쓴다.
    function de_swap(p) {
      const D = de_near(p.d), big = D > p.d, num = de_num(p);
      const e = num / D, dp = e >= 100 && !p.k ? 0 : e >= 10 ? 1 : 2, z = 10 ** dp;
      const E = de_div(num, D, dp), P = Math.round(100 * Math.abs(D - p.d) / p.d);
      const C = de_div(E.v * P, 100 * z, dp);   // E의 P%
      const est = P ? fmt((E.v + (big ? 1 : -1) * C.v) / z) : E.s;
      // ok: 이 어림을 반올림해 넣으면 정답 범위 안인지 (P를 정수 %로 반올림한 탓에 빗나가면 이 풀이는 안 쓴다)
      return { D, big, P, E, C, est, ok: de_ok(p, Math.round(+est)) };
    }

    // 몫 쪼개기: N = d × c ± r (c는 몫의 앞 한두 자리), 남은 r ÷ d 는 소수로.
    // r ÷ d 가 2 이상이면 가까운 배수 d × m 부터 보여 준다.
    function de_splitQ(p) {
      const { N, d } = p, a = de_ans(p);
      const u = a < 10 ? 1 : 10 ** Math.max(1, String(a).length - 2);
      const c = Math.round(N / d / u) * u, r = N - d * c, R = Math.abs(r), m = Math.round(R / d);
      return { c, r, R, y: de_div(R, d, 2), near: m >= 2 ? `${d} × ${m} = ${d * m}` : '' };
    }
    // 10% 덩어리 세기: c% = d × c/100, 남은(넘친) 양을 1%(d/100)로 나눈다
    function de_splitP(p) {
      const { N, d } = p, c = Math.round(N * 10 / d) * 10;
      const V10 = d * c / 10, r10 = 10 * N - V10;   // 10배 정수로 계산
      return { c, r10, V: fmt(V10 / 10), R: fmt(Math.abs(r10) / 10), ten: fmt(d / 10), one: fmt(d / 100),
               y: de_div(10 * Math.abs(r10), d, 2) };   // 남은 양 ÷ 1%
    }

    // 결론 끝 "→ 약 82" 는 줄바꿈으로 갈라지지 않게 붙인다
    const de_tail = p => `→\u00a0약\u00a0${de_ans(p)}${de_pct(p)}`;
    const de_last = p => [de_what(p), `정확히는 ${de_x(p).s}${de_pct(p)} ${de_tail(p)}`];

    function de_swapSteps(p, w) {
      const pc = de_pct(p);
      const steps = [['바꾸기', w.P ? `${p.d} → ${w.D}: 약 ${w.P}% ${w.big ? '키웠어요' : '줄였어요'}` : `${p.d} → ${w.D}: 차이 0.5% 미만`],
                     ['어림', `${p.N} ÷ ${w.D} ${w.E.eq} ${w.E.s}${pc}`]];
      if (w.P) {
        // 비율은 %p가 아니라 그 값의 몇 %인지 분명히
        steps.push(['보정', `실제 ${de_what(p)}은 ${p.k ? `${w.E.s}%의 ` : ''}약 ${w.P}%${p.k ? '만큼' : ''} 더 ${w.big ? '커요' : '작아요'}`]);
        steps.push([`${w.big ? '+' : '−'}${w.P}%`, `${w.E.s}의 ${w.P}% ${w.C.eq} ${w.C.s} → ${w.est}${pc}`]);
      } else steps.push(['보정', '거의 같아서 그대로 써요']);
      return [...steps, de_last(p)];
    }

    function de_splitQSteps(p) {
      const { N, d } = p, { c, r, R, y, near } = de_splitQ(p);
      return [
        ['어림', `${d} × ${c} = ${d * c}`],
        r > 0 ? ['남은 수', `${N} − ${d * c} = ${R}`] : ['넘친 수', `${d * c} − ${N} = ${R}`],
        ...(near ? [['', near]] : []),
        ['', `${R} ÷ ${d} ${y.eq} ${y.s}`],
        ['몫', `${c} ${r > 0 ? '+' : '−'} ${y.s} = ${de_x(p).s} ${de_tail(p)}`],
      ];
    }

    function de_splitPSteps(p) {
      const { N, d } = p, { c, r10, V, R, ten, one, y } = de_splitP(p), steps = [];
      if (c === 100) steps.push(['넘친 수', `${d}(100%) − ${N} = ${R}`]);
      else if (c) {
        steps.push(['10%', `${d} ÷ 10 = ${ten}`]);
        if (c > 10) steps.push([`${c}%`, `${ten} × ${c / 10} = ${V}`]);
        steps.push(r10 > 0 ? ['남은 수', `${N} − ${V} = ${R}`] : ['넘친 수', `${V} − ${N} = ${R}`]);
      }
      steps.push(['1%', `${d} ÷ 100 = ${one}`]);
      steps.push(['', `${R} ÷ ${one} ${y.eq} ${y.s}`]);
      steps.push(['비율', `${c ? `${c} ${r10 > 0 ? '+' : '−'} ${y.s} = ` : ''}${de_x(p).s}% ${de_tail(p)}`]);
      return steps;
    }

    // ----- 팁 -----
    // 몫 쪼개기로 확인 (바꿔 어림이 본 풀이일 때)
    function de_splitQTip(p) {
      const { N, d } = p, { c, r, R, y, near } = de_splitQ(p), s = r > 0 ? '+' : '−';
      return tip('쪼개서 확인', `${N} = ${d} × ${c} ${s} ${R}`, ...(near ? [near] : []), `${R} ÷ ${d} ${y.eq} ${y.s}`, `${c} ${s} ${y.s} = ${de_x(p).s}`);
    }
    // 10%·1% 세기로 확인 (바꿔 어림이 본 풀이일 때)
    function de_splitPTip(p) {
      const { N, d } = p, { c, r10, V, R, ten, one, y } = de_splitP(p), x = de_x(p).s;
      if (!c) return tip('1%로 확인', `1% = ${one}`, `${N} ÷ ${one} ${y.eq} ${y.s} → ${x}%`);
      const head = c === 100 ? `100% = ${d}` : c === 10 ? `10% = ${V}` : `10% = ${ten} → ${c}% = ${V}`;
      return tip('10%로 확인', head, r10 > 0 ? `${N} − ${V} = ${R}` : `${V} − ${N} = ${R}`,
                 `${R} ÷ ${one}(1%) ${y.eq} ${y.s}`, `${c} ${r10 > 0 ? '+' : '−'} ${y.s} = ${x}%`);
    }
    // 바꿔 어림으로 방향·크기 확인 (쪼개기가 본 풀이일 때, 차이가 15% 이하이고 보정한 값이 정답 범위 안이면)
    function de_swapTip(p, w) {
      if (!w.P || w.P > 15 || !w.ok) return null;
      const more = w.big ? '커요' : '작아요';
      return tip('어림 검산', `${p.N} ÷ ${w.D} ${w.E.eq} ${w.E.s}${de_pct(p)}`,
                 `${w.D}${eun(w.D)} ${p.d}보다 약 ${w.P}% ${more}`,
                 p.k ? `→ 실제 비율은 그 값의 약 ${w.P}%만큼 더 ${more}` : `→ 실제 몫은 약 ${w.P}% 더 ${more}`,
                 `${w.E.s}의 ${w.P}% ${w.C.eq} ${w.C.s} → ${w.est}${de_pct(p)}`);
    }
    // ÷25 = ×4 ÷100, ÷125 = ×8 ÷1000 (바꾼 수가 25·125 꼴일 때)
    function de_trickTip(p, w) {
      const m = String(w.D).startsWith('125') ? 8 : String(w.D).startsWith('25') ? 4 : 0;
      if (!m) return null;
      return tip(`÷${w.D} = ×${m} ÷ ${m * w.D}`, `${p.N} × ${m} = ${m * p.N}`, `${m * p.N} ÷ ${m * w.D} ${w.E.eq} ${w.E.s}${de_pct(p)}`);
    }
    // 분수 기준점: 가장 가까운 쉬운 분수와 크기 비교 (보이는 숫자가 같아지면 다음 후보)
    const de_MARKS = [[1, 20], [1, 10], [1, 8], [1, 6], [1, 5], [1, 4], [1, 3], [3, 8], [2, 5], [1, 2],
                      [3, 5], [5, 8], [2, 3], [3, 4], [4, 5], [5, 6], [7, 8], [9, 10], [19, 20]];
    function de_markTip(p) {
      const { N, d } = p, X = 100 * N / d, dp = d >= 10000 ? 0 : 1;
      const gap = ([u, v]) => Math.abs(100 * u / v - X);
      for (const [u, v] of de_MARKS.slice().sort((m1, m2) => gap(m1) - gap(m2))) {
        const T = de_div(d * u, v, dp), L = de_div(100 * u, v, 1);
        if (T.v === N * 10 ** dp) continue;
        const less = N * v < d * u;
        return tip('분수 기준점', `${u}/${v} ${L.eq} ${L.s}% → ${d}의 ${u}/${v} ${T.eq} ${T.s}`,
                   `${N} ${less ? '<' : '>'} ${T.s} → ${u}/${v}보다 ${less ? '작아요' : '커요'}`);
      }
      return null;
    }
    // 정답으로 인정하는 범위
    function de_rangeTip(p) {
      let lo = de_ans(p), hi = lo;
      while (lo > 1 && de_ok(p, lo - 1)) lo--;
      while (de_ok(p, hi + 1)) hi++;
      return tip('허용 범위', `${lo}부터 ${hi}까지 모두 정답이에요`, '이 정도로만 맞히면 충분해요');
    }
    // 다섯 자리는 앞 세 자리만 (오차 50 ÷ 10000 = 0.5% 미만)
    function de_bigTip(p) {
      const N3 = Math.round(p.N / 100) * 100;
      if (p.N < 10000 || N3 === p.N) return null;
      return tip('앞 세 자리만', `${p.N} ≈ ${N3} (오차 0.5% 미만)`, '어림할 땐 앞 세 자리면 충분해요');
    }

    TYPES.est = {
      section: 'div', title: '어림 나눗셈', ex: '3847 ÷ 47 ≈ 82', fields: ['N', 'd', 'k'],
      gen: () => coin(0.35) ? de_genP() : de_genQ(),
      answer: de_ans,
      unit: de_pct,
      accept: de_ok,
      answerText: p => `약 ${de_ans(p)}${de_pct(p)}`,
      heading: p => { const x = de_x(p); return `${p.N} ÷ ${p.d} ${x.eq} ${x.s}${de_pct(p)}`; },
      prompt: p => ({
        main: `${p.N} ÷ ${p.d}`,
        sub: p.k ? '비율은 약 몇 %? (오차 ±1%p까지 정답)' : `몫은 대략 얼마? (오차 ±${3 * p.N > 100 * p.d ? '3%' : '1'}까지 정답)`,
      }),
      label: p => p.k ? `${p.N}${eun(p.N)} ${p.d}의 몇 %` : `${p.N} ÷ ${p.d} 어림`,
      hint: p => {
        const w = de_swap(p);
        if (w.P <= 7 && w.ok) {   // 가까운 쉬운 수가 있고 그 어림이 정답 범위에 들면 바꿔 어림이 본 풀이
          const check = p.k ? de_splitPTip(p) : de_splitQTip(p);
          const more = de_trickTip(p, w) || (p.k ? de_markTip(p) : de_bigTip(p) || de_rangeTip(p));
          return { steps: de_swapSteps(p, w), tips: [check, more].filter(Boolean) };
        }
        return p.k ? { steps: de_splitPSteps(p), tips: [de_markTip(p), de_swapTip(p, w)].filter(Boolean) }
                   : { steps: de_splitQSteps(p), tips: [de_swapTip(p, w), de_bigTip(p) || de_rangeTip(p)].filter(Boolean) };
      },
    };

  // ===== 나눗셈: 분수 비교 =====
    // ---------- 나눗셈: 분수 비교 (어느 쪽이 더 큰가) ----------
    // p = { A, B, C, D } → 앞 A/B 와 뒤 C/D 중 큰 쪽 (정답 1 = 앞, 2 = 뒤). 두 분수는 절대 같지 않게 만든다.
    const dc_big = p => p.A * p.D > p.C * p.B ? 1 : 2;
    const dc_side = p => dc_big(p) === 1 ? '앞' : '뒤';
    const dc_is = s => s === '앞' ? '앞이' : '뒤가';
    // 두 분수 값의 상대 차이 (작은 쪽 기준)
    const dc_rel = (a, b, c, d) => Math.abs(a * d - c * b) / Math.min(a * d, c * b);
    // 큰 줄: 세 자리끼리면 "vs" 대신 쉼표로 16자 안에
    const dc_main = p => {
      const s = `${p.A}/${p.B} vs ${p.C}/${p.D}`;
      return s.length <= 16 ? s : `${p.A}/${p.B}, ${p.C}/${p.D}`;
    };

    // 자리수 모양: [분자 범위, 분모 범위, 값 범위(천분율)]
    const dc_SHAPE = {
      s22: [[10, 99], [12, 99], [150, 950]],       // 37/52
      s23: [[10, 99], [100, 999], [40, 600]],      // 47/312 (비중)
      s33: [[100, 999], [120, 999], [200, 950]],   // 372/521
      b22: [[12, 99], [10, 95], [1050, 2400]],     // 83/71 (1보다 큼)
      b33: [[110, 999], [100, 950], [1030, 1800]], // 412/385
    };
    const dc_first = ([nR, dR, rR]) => { const d = rnd(dR[0], dR[1]); return [Math.round(d * rnd(rR[0], rR[1]) / 1000), d]; };
    // 두 분수가 모두 1보다 작거나 모두 1보다 큰가 (딱 1인 분수는 빼기)
    const dc_sameSide = (a, b, c, d) => a !== b && c !== d && (a < b) === (c < d);

    // 함정: 분자·분모가 함께 커진다 (분모 2~30%↑), 값은 0.5~4.5%만 차이 (반올림으로 6.5%까지)
    function dc_grow(shape) {
      const [nR, dR] = shape;
      for (;;) {
        const [Yn, Yd] = dc_first(shape);
        const Xd = Yd + Math.max(1, Math.round(Yd * rnd(2, 30) / 100));
        const Xn = Math.round(Yn * Xd / Yd * (1000 + (coin() ? 1 : -1) * rnd(5, 45)) / 1000);
        if (!inR(Yn, nR) || !inR(Xn, nR) || Xd > dR[1] || Xn <= Yn || !dc_sameSide(Yn, Yd, Xn, Xd)) continue;
        const r = dc_rel(Yn, Yd, Xn, Xd);
        if (r >= 0.004 && r <= 0.065) return [Yn, Yd, Xn, Xd];
      }
    }
