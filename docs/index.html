    // 바로 보이는 문제: 분자는 크고 분모는 작은 쪽
    function dc_dom(shape) {
      const [nR, dR] = shape;
      for (;;) {
        const [Yn, Yd] = dc_first(shape);
        const Xn = Yn + rnd(1, Math.max(1, Math.round(Yn * 0.03)));
        const Xd = Yd - rnd(1, Math.max(1, Math.round(Yd * 0.03)));
        if (inR(Yn, nR) && inR(Xn, nR) && inR(Xd, dR) && dc_sameSide(Yn, Yd, Xn, Xd) && dc_rel(Yn, Yd, Xn, Xd) <= 0.08) return [Yn, Yd, Xn, Xd];
      }
    }

    // 기준값(1/2·1/3·0.7·1 …) 바로 위 하나, 바로 아래 하나 (분자·분모는 같은 방향)
    const dc_STRADDLE = [[1, 2], [1, 2], [1, 2], [1, 3], [2, 3], [1, 4], [3, 4], [1, 5], [2, 5], [3, 5], [4, 5], [3, 10], [7, 10], [1, 1]];
    function dc_straddle() {
      const [bp, bq] = pick(dc_STRADDLE);
      const [nR, dR] = dc_SHAPE[pick(bp / bq < 0.6 ? ['s22', 's23', 's33'] : ['s22', 's33'])];
      const lo = Math.max(dR[0], Math.ceil(nR[0] * bq / bp)), hi = Math.min(dR[1], Math.floor(nR[1] * bq / bp));
      const near = (d, above) => {
        const k = rnd(1, Math.max(1, Math.round(bp * d / bq * 0.03)));
        return above ? Math.floor(bp * d / bq) + k : Math.ceil(bp * d / bq) - k;
      };
      for (;;) {
        const d1 = rnd(lo, hi), d2 = rnd(lo, hi), n1 = near(d1, true), n2 = near(d2, false);
        if (!inR(n1, nR) || !inR(n2, nR) || (n1 - n2) * (d1 - d2) <= 0 || 3 * Math.min(d1, d2) < 2 * Math.max(d1, d2)) continue;
        const r = dc_rel(n1, d1, n2, d2);
        if (r >= 0.004 && r <= 0.065) return [n1, d1, n2, d2];
      }
    }

    // ---------- 풀이 팁 ----------
    // n/d 를 소수 둘째 자리로: h = 반올림한 100배 값, exact = 딱 떨어지는가
    const dc_dec = (n, d) => ({ h: Math.round(n * 100 / d), exact: (n * 100) % d === 0 });
    const dc_decText = x => `${x.exact ? '=' : '≈'} ${fmt(x.h / 100)}`;

    // 기준값 후보 [p, q] = p/q (앞쪽일수록 쉬운 기준)
    const dc_BENCH = (() => {
      const list = [[1, 2], [1, 1]];
      for (let k = 1; k <= 30; k++) if (k !== 5 && k !== 10) list.push([k, 10]);
      for (const k of [25, 75, 125, 175, 225, 275]) list.push([k, 100]);
      list.push([1, 3], [2, 3], [4, 3], [5, 3]);
      return list;
    })();
    const dc_benchName = (bp, bq) => bq === 2 ? '1/2' : bq === 3 ? `${bp}/3` : fmt(bp / bq);

    // 두 분수 사이에 기준값이 있으면: 각각 기준값과 비교하는 줄 + 결론
    function dc_benchTip(p) {
      const { A, B, C, D } = p;
      for (const [bp, bq] of dc_BENCH) {
        const sa = Math.sign(A * bq - bp * B), sc = Math.sign(C * bq - bp * D);
        if (!sa || sa !== -sc) continue;
        const name = dc_benchName(bp, bq);
        const line = (side, n, d) => {
          const c = n * bq > bp * d ? '>' : '<';
          if (bq === 1 && bp === 1) return `${side}: 분자 ${n} ${c} 분모 ${d}`;
          if (bq === 2) return `${side}: ${n} ${c} ${d} ÷ 2 = ${fmt(d / 2)}`;
          if (bq === 3) return `${side}: ${n} × 3 = ${n * 3} ${c} ${bp === 1 ? d : `${d} × ${bp} = ${d * bp}`}`;
          return `${side}: ${n} ${c} ${d} × ${name} = ${fmt(d * bp / bq)}`;
        };
        const s = sa > 0 ? '>' : '<';
        return {
          nice: bq <= 2 || bq === 10,
          tip: tip(`${name} 기준`, line('앞', A, B), line('뒤', C, D), `${A}/${B} ${s} ${name} ${s} ${C}/${D} → ${dc_is(dc_side(p))} 커요`),
        };
      }
      return null;
    }

    // 증가율: 앞 → 뒤로 분자·분모가 몇 % 변했나 (같은 방향일 때). 소수 첫째 자리에서 같으면 둘째 자리까지
    function dc_pct(from, to, dec) {
      const num = Math.abs(to - from) * 100 * 10 ** dec;
      return { r: Math.round(num / from), exact: num % from === 0, dec };
    }
    function dc_rateTip(p) {
      const { A, B, C, D } = p, inc = C > A, word = inc ? '증가' : '감소';
      for (const dec of [1, 2]) {
        const n = dc_pct(A, C, dec), d = dc_pct(B, D, dec);
        if (n.r === d.r) continue;
        const line = (nm, from, to, x) => `${nm} ${from} → ${to}: ${x.exact ? '' : '약 '}${fmt(x.r / 10 ** x.dec)}% ${word}`;
        const end = `${n.r > d.r ? '분자' : '분모'}가 더 많이 ${inc ? '늘었' : '줄었'}으니 ${dc_is(dc_side(p))} 커요`;
        return tip(`${word}율 비교`, line('분자', A, C, n), line('분모', B, D, d), end);
      }
      return null;
    }

    // 차이 분수: 분자·분모가 큰 쪽(X) = 작은 쪽(Y)에 (분자 차)/(분모 차)를 섞은 것.
    // 차이 분수가 Y보다 크면 X가 Y보다 크고, 작으면 X가 Y보다 작다.
    function dc_diffTip(p) {
      const { A, B, C, D } = p, backBig = C > A;
      const [Yn, Yd, Xn, Xd] = backBig ? [A, B, C, D] : [C, D, A, B];
      const X = backBig ? '뒤' : '앞', Y = backBig ? '앞' : '뒤';
      const a = Xn - Yn, b = Xd - Yd, dv = dc_dec(a, b), yv = dc_dec(Yn, Yd);
      if (dv.h === yv.h) return null;
      const more = a * Yd > b * Yn, s = more ? '>' : '<';
      // 약분해서 보기 (12/12 → 1, 2/6 → 1/3)
      const g = gcd(a, b), red = b === g ? String(a / g) : `${a / g}/${b / g}`;
      const sub = `차이 (${Xn}−${Yn})/(${Xd}−${Yd}) = ${a}/${b}`;
      const l1 = red !== `${a}/${b}` && `${sub} = ${red}`.length <= 34 ? `${sub} = ${red}` : sub;
      const left = b === g ? red : `${red} ${dc_decText(dv)}`, right = `${Yn}/${Yd} ${dc_decText(yv)}`;
      const l2 = `${left} ${s} ${Y} ${right}`;
      return tip('차이 분수', l1, l2.length <= 34 ? l2 : `${left} ${s} ${right}`,
        more ? `차이 분수가 더 크니 ${dc_is(X)} 커요` : `차이 분수가 더 작으니 ${dc_is(X)} 작아요 → ${dc_is(Y)} 커요`);
    }

    // 분자는 크고 분모는 작으면 계산 없이 끝
    function dc_domTip(p) {
      const { A, B, C, D } = p, c = (x, y) => x > y ? '>' : x < y ? '<' : '=';
      const why = A === C ? '분자가 같으면 분모가 작은 쪽이 커요'
                : B === D ? '분모가 같으면 분자가 큰 쪽이 커요'
                : '분자는 크고 분모는 작은 쪽이 커요';
      return tip('바로 보기', `분자 ${A} ${c(A, C)} ${C}, 분모 ${B} ${c(B, D)} ${D}`, `${why} → ${dc_side(p)}`);
    }

    function dc_tips(p) {
      if ((p.C - p.A) * (p.D - p.B) <= 0) return [dc_domTip(p)];
      const v = dc_benchTip(p), g = dc_rateTip(p), m = dc_diffTip(p);
      const order = v && v.nice ? [v.tip, g, m] : [g, v && v.tip, m];
      return order.filter(Boolean).slice(0, 2);
    }

    TYPES.cmp = {
      section: 'div', title: '분수 비교', ex: '37/52 vs 41/57', fields: ['A', 'B', 'C', 'D'],
      gen() {
        const r = rnd(1, 100);
        const q = r <= 30 ? dc_grow(dc_SHAPE.s22)
                : r <= 47 ? dc_grow(dc_SHAPE.s23)
                : r <= 66 ? dc_grow(dc_SHAPE.s33)
                : r <= 73 ? dc_grow(dc_SHAPE[pick(['b22', 'b33'])])
                : r <= 92 ? dc_straddle()
                : dc_dom(dc_SHAPE[pick(['s22', 's23', 's33'])]);
        const [A, B, C, D] = coin() ? q : [q[2], q[3], q[0], q[1]];
        return { t: 'cmp', A, B, C, D };
      },
      answer: dc_big,
      answerText: p => `${dc_side(p)} (${dc_big(p) === 1 ? `${p.A}/${p.B}` : `${p.C}/${p.D}`})`,
      finalToken: dc_side,
      choices: p => [`앞 <small>${p.A}/${p.B}</small>`, `뒤 <small>${p.C}/${p.D}</small>`],
      prompt: p => ({ main: dc_main(p), sub: '어느 쪽이 더 클까요?' }),
      label: p => `${p.A}/${p.B} vs ${p.C}/${p.D} 중 큰 쪽`,
      heading: p => `${p.A}/${p.B} ${dc_big(p) === 1 ? '>' : '<'} ${p.C}/${p.D}`,
      hint: p => {
        const { A, B, C, D } = p, P = A * D, Q = C * B, tips = dc_tips(p);
        // 세 자리 곱은 오래 걸려요: 아래 요령(팁)을 먼저 보도록
        const slow = Math.max(A, B, C, D) >= 100 && tips.length;
        return {
          steps: [['대각선', slow ? '분자 × 상대 분모 (세 자리면 아래 요령이 빨라요)' : '분자 × 상대 분모끼리 비교'],
                  ['앞', `${A} × ${D} = ${P}`],
                  ['뒤', `${C} × ${B} = ${Q}`],
                  ['결론', `${P} ${P > Q ? '>' : '<'} ${Q} → ${dc_is(dc_side(p))} 커요`]],
          tips,
        };
      },
    };
  /* @@EXTENSIONS@@ */

  // ---------- 풀이 화면 HTML ----------
  function gridHTML(g, aria) {
    const rows = g.rows.map(r => {
      const cells = [`<i class="op">${r.pre}</i>`, '<i></i>'];
      for (let k = 0; k < g.width - r.s.length - r.sh; k++) cells.push('<i></i>');
      for (const ch of r.s) cells.push(`<i>${ch}</i>`);
      for (let k = 0; k < r.sh; k++) cells.push('<i class="dim">0</i>');
      return `<div class="hc-row${r.ruled ? ' ruled' : ''}${r.res ? ' res' : ''}">${cells.join('')}</div>`;
    }).join('');
    const notes = g.rows.map(r => `<div class="hc-note">${r.note || ''}</div>`).join('');
    return `<div class="hc" aria-label="${aria}"><div class="hc-grid">${rows}</div><div class="hc-notes">${notes}</div></div>`;
  }
  function hintHTML(p) {
    const h = hint(p);
    let html = '';
    if (h.grid) html += gridHTML(h.grid, label(p));
    if (h.steps && h.steps.length) {
      html += `<div class="steps">${h.steps.map(([k, v], i) =>
        `<div class="st${i === h.steps.length - 1 ? ' res' : ''}"><span class="k">${k}</span><span class="v">${v}</span></div>`).join('')}</div>`;
    }
    for (const t of h.tips || []) html += `<div class="tip"><b>${t.title}</b>${t.lines.map(l => `<span>${l}</span>`).join('')}</div>`;
    return html;
  }
  // ==== ENGINE END ====

  // ---------- 저장 ----------
  const KEY = 'gsat99.v1';
  const PRACTICE = 20, TA_SECONDS = 120;
  const SECTIONS = [['mult', '곱셈'], ['div', '나눗셈'], ['pct', '퍼센트']];
  const LEVELS = {
    teens:      { t: '19단',              a: [11, 19],   b: [11, 19] },
    squares:    { t: '제곱수',            a: [11, 99],   sq: true },
    twoByOne:   { t: '두 자리 × 한 자리',  a: [11, 99],   b: [2, 9] },
    twoByTwo:   { t: '두 자리 × 두 자리',  a: [11, 99],   b: [11, 99] },
    threeByOne: { t: '세 자리 × 한 자리',  a: [101, 999], b: [2, 9] },
    custom:     { t: '직접 설정' },
  };
  const MULT_KINDS = [['teens', '19단'], ['squares', '제곱수'], ['twoByOne', '두 자리 × 한 자리'], ['twoByTwo', '두 자리 × 두 자리'], ['threeByOne', '세 자리 × 한 자리']];

  const defaults = () => ({
    records: {}, bests: { mult: 0, div: 0, pct: 0 }, section: 'mult', level: 'twoByTwo', types: { div: 'mix', pct: 'mix' },
    custom: { aMin: 11, aMax: 99, bMin: 11, bMax: 19 }, tableN: 11,
  });
  let S = defaults();
  try {
    const raw = localStorage.getItem(KEY);
    if (raw) {
      const d = JSON.parse(raw), def = defaults();
      S = { ...def, ...d, custom: { ...def.custom, ...(d.custom || {}) }, types: { ...def.types, ...(d.types || {}) }, bests: { ...def.bests, ...(d.bests || {}) } };
      // 예전 저장 형식 옮기기
      if (d.best && !(d.bests && d.bests.mult)) S.bests.mult = d.best;
      if (d.bestPct && !(d.bests && d.bests.pct)) S.bests.pct = d.bestPct;
      if (d.pctType && !(d.types && d.types.pct)) S.types.pct = d.pctType;
      delete S.best; delete S.bestPct; delete S.pctType;
    }
  } catch (e) {}
  // 유형이 하나도 없는 영역은 탭을 숨긴다
  const liveSections = () => SECTIONS.filter(([k]) => k === 'mult' || typeList(k).length);
  if (!liveSections().some(([k]) => k === S.section)) S.section = 'mult';
  if (!LEVELS[S.level]) S.level = 'twoByTwo';
  for (const sec of ['div', 'pct']) if (S.types[sec] !== 'mix' && !(TYPES[S.types[sec]] && TYPES[S.types[sec]].section === sec)) S.types[sec] = 'mix';
  const save = () => { try { localStorage.setItem(KEY, JSON.stringify(S)); } catch (e) {} };

  // ---------- 기록 ----------
  const weakness = r => r.w * 2 / (r.c + 1);
  const isWeak = p => { const r = S.records[pid(p)]; return !!r && r.w > 0 && weakness(r) >= 0.5; };
  const weakList = section => Object.entries(S.records)
    .filter(([k, r]) => knownId(k) && r.w > 0 && weakness(r) >= 0.5 && (!section || sectionOf(parse(k)) === section))
    .sort((x, y) => weakness(y[1]) - weakness(x[1]) || x[0].localeCompare(y[0]))
    .map(([k]) => parse(k));
  const kindOf = p => p.t !== 'm' ? p.t
    : (inR(p.a, [11, 19]) && inR(p.b, [11, 19])) ? 'teens'
    : p.a === p.b ? 'squares'
    : Math.max(p.a, p.b) >= 100 ? 'threeByOne'
    : (p.a < 10 || p.b < 10) ? 'twoByOne' : 'twoByTwo';

  function record(p, ok, secs) {
    const r = S.records[pid(p)] || (S.records[pid(p)] = { c: 0, w: 0, t: 0 });
    if (ok) { r.c++; r.t += secs; } else { r.w++; }
    save();
  }

  function ranges() {
    const L = LEVELS[S.level];
    if (L.sq) return { a: L.a, b: L.a, sq: true };
    if (L.a) return { a: L.a, b: L.b };
    const c = S.custom;
    return {
      a: [Math.max(11, Math.min(c.aMin, c.aMax)), Math.max(11, c.aMin, c.aMax)],
      b: [Math.min(c.bMin, c.bMax), Math.max(c.bMin, c.bMax)],
    };
  }
  const rangeText = r => r.sq ? `${r.a[0]}² ~ ${r.a[1]}²` : `${r.a[0]}~${r.a[1]} × ${r.b[0]}~${r.b[1]}`;

  // pool: { list } (오답 복습) | { a, b, sq? } (곱셈 범위) | { section, type } (나눗셈·퍼센트)
  // 한 세션 안에서는 같은 문제를 다시 내지 않는다. 문제 수가 적은 범위(19단 등)는
  // 전부 섞어 놓고 하나씩 뽑고, 다 쓰면 다시 섞는다.
  const shuffle = arr => { for (let i = arr.length - 1; i > 0; i--) { const j = rnd(0, i); [arr[i], arr[j]] = [arr[j], arr[i]]; } return arr; };
  function makePicker(pool) {
    const seen = new Set();
    let bag = [], weakUsed = 0;
    const fits = x => pool.section ? (x.t !== 'm' && sectionOf(x) === pool.section && (pool.type === 'mix' || x.t === pool.type))
                                   : (x.t === 'm' && inR(x.a, pool.a) && inR(x.b, pool.b) && (!pool.sq || x.a === x.b));
    const size = pool.a ? (pool.sq ? pool.a[1] - pool.a[0] + 1 : (pool.a[1] - pool.a[0] + 1) * (pool.b[1] - pool.b[0] + 1)) : Infinity;
    const all = () => {
      const out = [];
      for (let a = pool.a[0]; a <= pool.a[1]; a++) {
        if (pool.sq) { out.push({ t: 'm', a, b: a }); continue; }
        for (let b = pool.b[0]; b <= pool.b[1]; b++) out.push({ t: 'm', a, b });
      }
      return out;
    };
    const fromBag = make => {
      if (!bag.length) { bag = shuffle(make().filter(x => !seen.has(pid(x)))); if (!bag.length) { seen.clear(); bag = shuffle(make()); } }
      return bag.pop();
    };
    const gen = () => pool.section ? genSection(pool.section, pool.type) : { t: 'm', a: rnd(...pool.a), b: rnd(...pool.b) };
    const fresh = () => {
      if (size <= 400) return fromBag(all);
      for (let i = 0; i < 50; i++) { const p = gen(); if (!seen.has(pid(p))) return p; }
      return gen();
    };
    return {
      next() {
        let p;
        if (pool.list) {
          p = fromBag(() => pool.list);   // 오답 복습: 약한 문제를 한 번씩
        } else {
          // 약한 문제는 가끔(15%), 세션당 최대 5개, 이번 세션에 안 나온 것만
          const weak = weakUsed < 5 ? weakList().filter(x => fits(x) && !seen.has(pid(x))) : [];
          if (weak.length && coin(0.15)) {
            p = weak[rnd(0, Math.min(weak.length, 10) - 1)];
            weakUsed++;
            bag = bag.filter(x => pid(x) !== pid(p));
          } else {
            p = fresh();
          }
        }
        seen.add(pid(p));
        return p;
      },
    };
  }

  // ---------- 아이콘 ----------
  const I = {
    pencil: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 20h4L19 9l-4-4L4 16z"/><path d="M13.5 6.5l4 4"/></svg>',
    timer: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="13" r="8"/><path d="M12 9v4l2.5 2.5M9 2h6"/></svg>',
    redo: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 12a8 8 0 1 0 2.3-5.6L4 8.7"/><path d="M4 4v4.7h4.7"/></svg>',
    table: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3.5" y="3.5" width="17" height="17" rx="2"/><path d="M3.5 9.5h17M3.5 15h17M9.5 3.5v17"/></svg>',
    chart: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M5 20V11M12 20V4M19 20v-6"/></svg>',
    chev: '<svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M9 6l6 6-6 6"/></svg>',
    back: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 5l-7 7 7 7"/></svg>',
    bulb: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 18h6M10 21h4M12 3a6 6 0 0 0-3.6 10.8c.6.5 1 1.2 1.1 2V16h5v-.2c.1-.8.5-1.5 1.1-2A6 6 0 0 0 12 3z"/></svg>',
  };
  const topBar = title => `<div class="top"><button class="icon-btn" data-act="home" aria-label="처음으로">${I.back}</button><h2>${title}</h2><span class="spacer"></span></div>`;

  // ---------- 화면 전환 ----------
  const $ = id => document.getElementById(id);
  const views = ['home', 'quiz', 'result', 'table', 'stats'];
  let current = 'home';
  function show(v) {
    current = v;
    for (const n of views) $('v-' + n).hidden = n !== v;
    if (v === 'home') renderHome();
    if (v === 'table') renderTable();
    if (v === 'stats') renderStats();
    $('v-' + v).scrollTop = 0;
  }

  // ---------- 홈 ----------
  function renderHome() {
    const sec = S.section;
    const weakN = weakList(sec).length;
    let picker;
    if (sec === 'mult') {
      const r = ranges();
      const levelBtns = Object.entries(LEVELS).map(([k, L]) => {
        const rr = L.sq ? { a: L.a, sq: true } : L.a ? L : r;
        return `<button class="level" data-act="level" data-v="${k}" aria-pressed="${S.level === k}"><b>${L.t}</b><span>${rangeText(rr)}</span></button>`;
      }).join('');
      const c = S.custom;
      const step = (key, val) => `<span class="stepper"><button data-act="step" data-k="${key}" data-d="-1" aria-label="줄이기">−</button><output>${val}</output><button data-act="step" data-k="${key}" data-d="1" aria-label="늘리기">+</button></span>`;
      const custom = S.level !== 'custom' ? '' : `
        <div class="custom">
          <div class="crow"><span>앞 수</span>${step('aMin', c.aMin)}<span class="tilde">~</span>${step('aMax', c.aMax)}</div>
          <div class="crow"><span>뒤 수</span>${step('bMin', c.bMin)}<span class="tilde">~</span>${step('bMax', c.bMax)}</div>
        </div>`;
      picker = `<div class="levels">${levelBtns}</div>${custom}`;
    } else {
      const list = typeList(sec);
      const btn = (k, title, ex, wide) => `<button class="level${wide ? ' wide' : ''}" data-act="ptype" data-v="${k}" aria-pressed="${S.types[sec] === k}"><b>${title}</b><span>${ex}</span></button>`;
      picker = `<div class="levels">${btn('mix', '섞어서', `${list.length}가지 유형 모두`, true)}${list.map(t => btn(t, TYPES[t].title, TYPES[t].ex)).join('')}</div>`;
    }
    $('v-home').innerHTML = `
      <div class="brand"><h1>99단</h1><p>GSAT 수리 계산 연습장</p></div>
      <div class="seg" role="tablist" style="grid-template-columns:repeat(${liveSections().length},1fr)">${liveSections().map(([k, t]) =>
        `<button role="tab" data-act="section" data-v="${k}" aria-selected="${sec === k}">${t}</button>`).join('')}</div>
      <div class="label">${sec === 'mult' ? '범위' : '유형'}</div>
      ${picker}
      <div class="label">연습</div>
      <div class="modes">
        <button class="mode" data-act="start" data-mode="practice"><span class="ico teal">${I.pencil}</span><span class="txt"><b>연습하기</b><span>${PRACTICE}문제 · 모르면 풀이 보기</span></span><span class="chev">${I.chev}</span></button>
        <button class="mode" data-act="start" data-mode="ta"><span class="ico amber">${I.timer}</span><span class="txt"><b>타임어택</b><span>${TA_SECONDS / 60}분 도전 · 최고 기록 ${S.bests[sec]}개</span></span><span class="chev">${I.chev}</span></button>
        <button class="mode" data-act="start" data-mode="review" ${weakN ? '' : 'disabled'}><span class="ico red">${I.redo}</span><span class="txt"><b>오답 집중</b><span>${weakN ? `틀리거나 풀이 본 문제 ${weakN}개 복습` : '아직 약한 문제가 없어요'}</span></span><span class="chev">${I.chev}</span></button>
      </div>
      <div class="links">
        <button class="link" data-act="go" data-v="table">${I.table}곱셈표</button>
        <button class="link" data-act="go" data-v="stats">${I.chart}내 기록</button>
      </div>`;
  }

  // ---------- 문제 ----------
  let Q = null, timerId = null, advanceId = null;

  function startQuiz(mode, section = S.section) {
    stopTimers();
    let pool, count;
    if (mode === 'review') {
      const list = weakList(section);
      if (!list.length) return show('home');
      pool = { list }; count = Math.min(30, list.length);
    } else {
      pool = section === 'mult' ? ranges() : { section, type: S.types[section] };
      count = mode === 'ta' ? null : PRACTICE;
    }
    const picker = makePicker(pool);
    Q = { mode, section, picker, count, answered: 0, correct: 0, ctime: 0, streak: 0, mistakes: [], remaining: TA_SECONDS,
          started: Date.now(), qStart: Date.now(), cur: picker.next(), input: '', fb: 'none', step: 0, newRecord: false };
    show('quiz');
    $('q-barwrap').classList.toggle('ta', mode === 'ta');
    if (mode === 'ta') timerId = setInterval(tick, 1000);
    renderQuiz();
  }

  function stopTimers() {
    clearInterval(timerId); timerId = null;
    clearTimeout(advanceId); advanceId = null;
  }

  // 문제 글자 수에 맞춰 큰 줄 글씨 크기 조절 (한 줄에 들어가게)
  function fitProb(text) {
    const w = Math.min(document.documentElement.clientWidth, 520) - 72;
    return Math.max(24, Math.min(60, w / (text.length * 0.62))) + 'px';
  }

  function renderQuiz() {
    const p = Q.cur, pr = prompt(p), ch = choices(p);
    if (Q.count) {
      $('q-count').textContent = `${Math.min(Q.answered + (Q.fb === 'none' ? 1 : 0), Q.count)} / ${Q.count}`;
      $('q-count').className = '';
      $('q-bar').style.width = (Q.answered / Q.count * 100) + '%';
    } else {
      const m = Math.floor(Q.remaining / 60), s = String(Q.remaining % 60).padStart(2, '0');
      $('q-count').textContent = `${m}:${s}`;
      $('q-count').className = Q.remaining <= 10 ? 'low' : '';
      $('q-bar').style.width = (Q.remaining / TA_SECONDS * 100) + '%';
    }
    $('q-streak').textContent = Q.streak >= 3 ? `${Q.streak}연속` : '';
    $('q-correct').textContent = `✓ ${Q.correct}`;

    const revealed = Q.fb === 'revealed';
    $('q-card').className = 'card' + (Q.fb === 'correct' ? ' correct' : Q.fb === 'wrong' ? ' wrong' : '');
    for (const id of ['q-prob', 'q-sub', 'q-fb']) $(id).hidden = revealed;
    $('q-hc').hidden = !revealed;
    $('q-prob').textContent = pr.main;
    $('q-prob').style.fontSize = fitProb(pr.main);
    $('q-sub').textContent = pr.sub;
    $('q-sub').hidden = revealed || !pr.sub;
    $('q-ans').hidden = revealed || !!ch;
    $('q-ans').textContent = (Q.input || '?') + (Q.input ? unit(p) : '');
    $('q-ans').className = 'ans' + (Q.input ? '' : ' empty');
    const v = Number(Q.input);
    $('q-fb').textContent = Q.fb === 'correct' ? (v === answer(p) ? '정답!' : `정답! (${calcTitle(p)})`)
                          : Q.fb === 'wrong' ? `정답은 ${answerText(p)}` : '';
    if (revealed) $('q-hc').innerHTML = `<div class="hc-title">${calcTitle(p)}</div>${hintHTML(p)}`;

    $('q-hint').hidden = !(Q.fb === 'none' || Q.fb === 'wrong');
    $('q-keys').hidden = revealed || !!ch;
    $('q-choices').hidden = revealed || !ch;
    if (ch) {
      $('q-choices').innerHTML = ch.map((c, i) => {
        const n = i + 1, state = Q.fb === 'none' ? '' : n === answer(p) ? ' right' : String(n) === Q.input ? ' picked' : '';
        return `<button class="choice${state}" data-choice="${n}" ${Q.fb === 'none' ? '' : 'disabled'}>${c}</button>`;
      }).join('');
    }
    $('q-next').hidden = !revealed;
    $('q-ok').disabled = !(Q.input && Q.fb === 'none');
  }

  function typeDigit(d) {
    if (Q.fb !== 'none' || Q.input.length >= 5) return;
    if (!Q.input && d === '0') return;
    Q.input += d; renderQuiz();
  }
  function del() {
    if (Q.fb !== 'none' || !Q.input) return;
    Q.input = Q.input.slice(0, -1); renderQuiz();
  }
  function choose(n) {
    const ch = choices(Q.cur);
    if (Q.fb !== 'none' || !ch || n < 1 || n > ch.length) return;
    Q.input = String(n); submit();
  }

  function submit() {
    if (!Q.input || Q.fb !== 'none') return;
    const p = Q.cur, ok = accepts(p, Number(Q.input));
    const secs = (Date.now() - Q.qStart) / 1000;
    record(p, ok, secs);
    Q.answered++;
    if (ok) {
      Q.correct++; Q.ctime += secs; Q.streak++; Q.fb = 'correct';
    } else {
      Q.streak = 0; Q.mistakes.push(p); Q.fb = 'wrong';
    }
    renderQuiz();
    if (!ok) { const card = $('q-card'); void card.offsetWidth; card.classList.add('shake'); }
    const step = ++Q.step;
    const exact = Number(Q.input) === answer(p);
    advanceId = setTimeout(() => { if (Q && Q.step === step) advance(); }, ok ? (exact ? 400 : 1200) : 1600);
  }

  // 풀이 보기: 아직 답을 안 냈으면 틀린 것으로 기록
  function reveal() {
    if (!(Q.fb === 'none' || Q.fb === 'wrong')) return;
    if (Q.fb === 'none') {
      record(Q.cur, false, 0);
      Q.answered++; Q.streak = 0; Q.mistakes.push(Q.cur);
    }
    Q.step++; clearTimeout(advanceId);
    Q.input = ''; Q.fb = 'revealed';
    renderQuiz();
    $('q-card').scrollTop = 0;
  }

  function advance() {
    Q.step++;
    Q.input = ''; Q.fb = 'none';
    if (Q.count && Q.answered >= Q.count) return finish();
    Q.cur = Q.picker.next(); Q.qStart = Date.now();
    renderQuiz();
  }

  function tick() {
    if (!Q || current !== 'quiz') return;
    Q.remaining--;
    if (Q.remaining <= 0) return finish();
    renderQuiz();
  }

  function finish() {
    stopTimers();
    Q.ended = Date.now();
    if (Q.mode === 'ta' && Q.correct > S.bests[Q.section]) { S.bests[Q.section] = Q.correct; Q.newRecord = true; save(); }
    renderResult();
    show('result');
  }

  // ---------- 결과 ----------
  function renderResult() {
    const acc = Q.answered ? Math.round(Q.correct / Q.answered * 100) : 0;
    const avg = Q.correct ? (Q.ctime / Q.correct).toFixed(1) + '초' : '-';
    const secs = Math.round((Q.ended - Q.started) / 1000);
    const elapsed = secs >= 60 ? `${Math.floor(secs / 60)}분 ${secs % 60}초` : `${secs}초`;
    const best = S.bests[Q.section];
    const seen = new Set();
    const uniq = Q.mistakes.filter(p => !seen.has(pid(p)) && seen.add(pid(p)));
    const title = Q.mode === 'ta' ? `${Q.correct}개 맞혔어요` : `${Q.answered}문제 중 ${Q.correct}개 정답`;
    const secName = SECTIONS.find(([k]) => k === Q.section)[1];
    const kicker = `${secName} ` + { practice: '연습 끝', ta: '타임어택 끝', review: '오답 복습 끝' }[Q.mode];
    $('v-result').innerHTML = `
      <div class="res-head"><div class="kicker">${kicker}</div><h2>${title}</h2>${Q.newRecord ? '<span class="badge">신기록</span>' : ''}</div>
      <div class="tiles">
        <div class="tile"><b>${acc}%</b><span>정답률</span></div>
        <div class="tile"><b>${avg}</b><span>평균 풀이 시간</span></div>
        <div class="tile"><b>${Q.mode === 'ta' ? best + '개' : elapsed}</b><span>${Q.mode === 'ta' ? '최고 기록' : '걸린 시간'}</span></div>
        <div class="tile"><b>${Q.mistakes.length}</b><span>틀리거나 풀이 본 문제</span></div>
      </div>
      ${uniq.length ? `<div class="list" style="margin-top:16px"><div class="list-head"><b>다시 보기</b><span>눌러서 손계산 풀이</span></div>
        ${uniq.map(p => `<button class="row weak" data-act="calc" data-id="${pid(p)}"><span class="grow">${label(p)}</span><b>${answerText(p)}</b>${I.bulb}</button>`).join('')}</div>` : ''}
      <div class="stack">
        <button class="big-btn" data-act="retry">다시 하기</button>
        <button class="big-btn ghost" data-act="home">처음으로</button>
      </div>`;
  }

  // ---------- 곱셈표 ----------
  function renderTable() {
    const n = S.tableN;
    $('v-table').innerHTML = `${topBar('곱셈표')}
      <div class="picker" style="margin-top:8px">
        <span class="stepper"><button data-act="tstep" data-d="-1" aria-label="이전 단">−</button></span>
        <span class="n" id="t-n"></span>
        <input type="range" id="t-range" min="11" max="99" step="1" value="${n}" aria-label="단 고르기">
        <span class="stepper"><button data-act="tstep" data-d="1" aria-label="다음 단">+</button></span>
      </div>
      <div class="list" id="t-rows" style="margin-top:10px"></div>
      <div class="foot">눌러서 손계산 풀이 보기 · 빨간색은 자주 틀리는 문제</div>`;
    updateTable();
  }

  function updateTable() {
    const n = S.tableN;
    $('t-n').textContent = `${n}단`;
    $('t-range').value = n;
    $('t-rows').innerHTML = Array.from({ length: 19 }, (_, i) => {
      const p = { t: 'm', a: n, b: i + 1 };
      return `<button class="row${isWeak(p) ? ' weak' : ''}" data-act="calc" data-id="${pid(p)}"><span class="grow">${n} × ${i + 1}</span><b>${n * (i + 1)}</b></button>`;
    }).join('');
  }

  // ---------- 기록 ----------
  let confirmReset = false;
  function kindRows(list) {
    return list.map(([k, t]) => {
      let n = 0, c = 0, time = 0;
      for (const [id, r] of Object.entries(S.records)) if (knownId(id) && kindOf(parse(id)) === k) { n += r.c + r.w; c += r.c; time += r.t; }
      const acc = n ? Math.round(c / n * 100) : null;
      const color = acc === null ? '' : acc >= 90 ? 'var(--green)' : acc >= 70 ? 'var(--amber)' : 'var(--red)';
      return `<div class="kind"><div class="line"><b>${t}</b><span>${c ? `평균 ${(time / c).toFixed(1)}초 · ${n}문제` : ''}</span></div>
        ${acc === null ? '<div class="line"><span>아직 기록 없음</span></div>' :
          `<div class="meter"><div class="bar"><span style="width:${acc}%;background:${color}"></span></div><span class="pct">${acc}%</span></div>`}</div>`;
    }).join('');
  }

  function renderStats() {
    const recs = Object.entries(S.records).filter(([k]) => knownId(k)).map(([, r]) => r);
    const total = recs.reduce((s, r) => s + r.c + r.w, 0);
    const correct = recs.reduce((s, r) => s + r.c, 0);
    const weak = weakList().slice(0, 10).map(p => {
      const r = S.records[pid(p)];
      return `<button class="row" data-act="calc" data-id="${pid(p)}"><span class="grow">${label(p)} = ${answerText(p)}</span><span class="sub">✗${r.w} ✓${r.c}</span>${I.bulb}</button>`;
    }).join('');
    const kindsOf = sec => sec === 'mult' ? MULT_KINDS : typeList(sec).map(t => [t, TYPES[t].title]);
    $('v-stats').innerHTML = `${topBar('내 기록')}
      <div class="tiles">
        <div class="tile"><b>${total}</b><span>푼 문제</span></div>
        <div class="tile"><b>${total ? Math.round(correct / total * 100) + '%' : '-'}</b><span>전체 정답률</span></div>
      </div>
      ${SECTIONS.map(([sec, name]) => `<div class="list" style="margin-top:12px"><div class="list-head"><b>${name}</b><span>타임어택 최고 ${S.bests[sec]}개</span></div>${kindRows(kindsOf(sec))}</div>`).join('')}
      <div class="list" style="margin-top:12px"><div class="list-head"><b>자주 틀리는 문제</b><span>눌러서 풀이</span></div>
        ${weak || '<div class="row" style="border-top:0;color:var(--muted);font-family:var(--font-body)">아직 없어요</div>'}</div>
      <div style="margin-top:12px">${confirmReset
        ? '<div class="confirm"><span>모든 기록을 지울까요?</span><button class="no" data-act="reset-no">취소</button><button class="yes" data-act="reset-yes">지우기</button></div>'
        : '<button class="danger" data-act="reset">기록 초기화</button>'}</div>`;
  }

  // ---------- 풀이 시트 ----------
  function openCalc(id) {
    if (!knownId(id)) return;
    const p = parse(id);
    $('sheet-panel').innerHTML = `<h3>${calcTitle(p)}</h3><div class="hc-wrap">${hintHTML(p)}</div><button class="big-btn ghost" data-act="close-sheet">닫기</button>`;
    $('sheet').hidden = false;
  }

  // ---------- 입력 ----------
  document.addEventListener('click', e => {
    if (Q && current === 'quiz') {
      const keyEl = e.target.closest('[data-key]');
      if (keyEl) {
        const k = keyEl.dataset.key;
        if (k === 'del') del(); else if (k === 'ok') submit(); else typeDigit(k);
        return;
      }
      const chEl = e.target.closest('[data-choice]');
      if (chEl) { choose(Number(chEl.dataset.choice)); return; }
    }
    const el = e.target.closest('[data-act]');
    if (!el) return;
    if (el.id === 'sheet' && e.target !== el) return;   // 시트 안쪽 클릭은 무시
    const act = el.dataset.act;
    switch (act) {
      case 'section': S.section = el.dataset.v; save(); renderHome(); break;
      case 'level': S.level = el.dataset.v; save(); renderHome(); break;
      case 'ptype': S.types[S.section] = el.dataset.v; save(); renderHome(); break;
      case 'step': {
        const k = el.dataset.k, lo = k[0] === 'a' ? 11 : 2;
        S.custom[k] = Math.min(99, Math.max(lo, S.custom[k] + Number(el.dataset.d)));
        save(); renderHome(); break;
      }
      case 'start': startQuiz(el.dataset.mode); break;
      case 'retry': startQuiz(Q.mode, Q.section); break;
      case 'home': stopTimers(); confirmReset = false; show('home'); break;
      case 'go': show(el.dataset.v); break;
      case 'reveal': reveal(); break;
      case 'next': advance(); break;
      case 'calc': openCalc(el.dataset.id); break;
      case 'close-sheet': $('sheet').hidden = true; break;
      case 'tstep': S.tableN = Math.min(99, Math.max(11, S.tableN + Number(el.dataset.d))); save(); updateTable(); break;
      case 'reset': confirmReset = true; renderStats(); break;
      case 'reset-no': confirmReset = false; renderStats(); break;
      case 'reset-yes':
        S = { ...defaults(), section: S.section, level: S.level, types: S.types, custom: S.custom, tableN: S.tableN };
        save(); confirmReset = false; renderStats(); break;
    }
  });

  document.addEventListener('input', e => {
    if (e.target.id === 't-range') {
      S.tableN = Number(e.target.value); save();
      updateTable();
    }
  });

  // 키보드(아이패드/PC)
  document.addEventListener('keydown', e => {
    if (!$('sheet').hidden && e.key === 'Escape') { $('sheet').hidden = true; return; }
    if (current !== 'quiz' || !Q) return;
    if (/^[0-9]$/.test(e.key)) { if (choices(Q.cur)) choose(Number(e.key)); else typeDigit(e.key); }
    else if (e.key === 'Backspace') del();
    else if (e.key === 'Enter') { Q.fb === 'revealed' ? advance() : submit(); }
    else if (e.key === 'h' || e.key === '?') reveal();
    else return;
    e.preventDefault();
  });

  show('home');

  if ('serviceWorker' in navigator && /github\.io$/.test(location.hostname)) {
    navigator.serviceWorker.register('sw.js').catch(() => {});
  }
})();
</script>

</body>
</html>
